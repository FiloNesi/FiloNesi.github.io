<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Sorteo de disertación</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&family=Nunito+Sans:ital,wght@0,400;0,700;0,800;1,400&display=swap">
<style>
/* Layout: proyectable en el aula; temas a la izquierda, reloj a la derecha; en móvil se apilan */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --fg:#1B1F22; --muted:#5B6870; --line:#D5DFDE;
  --teal:#0E5A5F; --teal-soft:#E1EEEE; --ochre:#B8622A; --ochre-soft:#F6E6DA; --danger:#B3261E;
  --display:'Domine', Georgia, serif; --body:'Nunito Sans', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111819; --surface:#182224; --fg:#E8EEEE; --muted:#9AAAAD; --line:#2B3A3C;
  --teal:#6FC1C4; --teal-soft:#16393B; --ochre:#E59A63; --ochre-soft:#3A2618; --danger:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111819; --surface:#182224; --fg:#E8EEEE; --muted:#9AAAAD; --line:#2B3A3C;
  --teal:#6FC1C4; --teal-soft:#16393B; --ochre:#E59A63; --ochre-soft:#3A2618; --danger:#F08A80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ochre)}
h1{font-family:var(--display);font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.15;color:var(--teal);margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:65ch}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.temas{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.tema{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px;transition:border-color .25s,background .25s,opacity .3s,transform .25s}
.num{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.q{font-family:var(--display);font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.3;min-width:0}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--teal-soft);border-radius:999px;padding:5px 10px;white-space:nowrap}
.tag[hidden]{display:none!important}
.tema.flash{border-color:var(--ochre);background:var(--ochre-soft)}
.tema.elegido{border-color:var(--teal);background:var(--teal-soft)}
.tema.elegido .num{color:var(--teal)}
.temas.hecho .tema:not(.elegido){opacity:.42}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px}
.panel h2{font-family:var(--display);font-size:1.15rem;margin:0;color:var(--fg)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font-family:var(--body);font-weight:800;font-size:1rem;border-radius:10px;border:2px solid var(--teal);background:var(--surface);color:var(--teal);padding:10px 16px;cursor:pointer;transition:background .15s,color .15s}
button:hover{background:var(--teal-soft)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
button.primary{background:var(--teal);color:var(--surface)}
button.primary:hover{filter:brightness(1.08);background:var(--teal)}
button:disabled{opacity:.45;cursor:not-allowed}
.preset{padding:8px 12px;font-size:.95rem}
.preset[aria-pressed="true"]{background:var(--teal);color:var(--surface)}
.reloj{font-family:var(--display);font-weight:700;font-size:clamp(4rem,9vw,7.5rem);line-height:1;text-align:center;font-variant-numeric:tabular-nums;color:var(--teal);letter-spacing:.02em}
.reloj.aviso{color:var(--ochre)}
.reloj.fin{color:var(--danger)}
.barra{height:10px;border-radius:999px;background:var(--teal-soft);overflow:hidden}
.barra span{display:block;height:100%;width:100%;background:var(--teal);transition:width 1s linear}
.reloj.aviso + .barra span{background:var(--ochre)}
.estado{text-align:center;color:var(--muted);font-weight:700;min-height:1.4em;margin:0}
label{font-weight:700;color:var(--muted);font-size:.9rem}
input[type=number]{width:5.5rem;font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
.sep{height:1px;background:var(--line)}
@media (prefers-reduced-motion:reduce){.tema,.barra span{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">Filosofía · 1º Bachillerato · Primera disertación</p>
    <h1>Tres preguntas para disertar</h1>
    <p class="lede">Se sortean tres de los cinco temas. Elige uno y escribe tu disertación antes de que termine la cuenta atrás.</p>
  </header>

  <div class="grid">
    <ol class="temas" id="temas" aria-live="polite"></ol>

    <section class="panel" aria-label="Sorteo y cuenta atrás">
      <div class="row">
        <button class="primary" id="sortear">Sortear 3 temas</button>
        <button id="reiniciarSorteo">Mostrar los 5</button>
      </div>
      <div class="sep"></div>
      <h2>Cuenta atrás</h2>
      <div class="row" id="presets" role="group" aria-label="Duración"></div>
      <div class="row">
        <label for="minutos">Otro tiempo (min)</label>
        <input type="number" id="minutos" min="1" max="180" value="30">
      </div>
      <div class="reloj" id="reloj">30:00</div>
      <div class="barra" aria-hidden="true"><span id="progreso"></span></div>
      <p class="estado" id="estado">Listo para empezar</p>
      <div class="row" style="justify-content:center">
        <button class="primary" id="iniciar">Empezar</button>
        <button id="reiniciar">Reiniciar</button>
        <button id="pantalla">Pantalla completa</button>
      </div>
    </section>
  </div>
</div>

<script>
const TEMAS=[
  '¿Puede la ciencia responder a todas nuestras preguntas?',
  '¿Es más importante saber hacerse preguntas que encontrar respuestas?',
  '¿Sirve la filosofía para algo?',
  '¿Ha dejado de ser necesaria la filosofía ahora que la ciencia y la tecnología avanzan tanto?',
  '¿Todo el mundo hace filosofía aunque no lo sepa?'
];
const $=id=>document.getElementById(id);
const lista=$('temas');
TEMAS.forEach((t,i)=>{
  const li=document.createElement('li');li.className='tema';
  li.innerHTML=`<span class="num">${i+1}</span><span class="q"></span><span class="tag" hidden>Seleccionado</span>`;
  li.querySelector('.q').textContent=t;lista.appendChild(li);
});
const items=[...lista.children];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let sorteando=false;

function limpiar(){items.forEach(li=>{li.classList.remove('elegido','flash');li.querySelector('.tag').hidden=true});lista.classList.remove('hecho')}
function elegirTres(){const idx=[0,1,2,3,4];for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return idx.slice(0,3).sort((a,b)=>a-b)}
function marcar(sel){sel.forEach(i=>{items[i].classList.add('elegido');items[i].querySelector('.tag').hidden=false});lista.classList.add('hecho')}

$('sortear').onclick=()=>{
  if(sorteando)return;limpiar();const sel=elegirTres();
  if(reduce){marcar(sel);return}
  sorteando=true;$('sortear').disabled=true;
  let paso=0;const total=18;
  const tick=()=>{
    items.forEach(li=>li.classList.remove('flash'));
    if(paso<total){items[Math.floor(Math.random()*5)].classList.add('flash');paso++;setTimeout(tick,70+paso*12)}
    else{marcar(sel);sorteando=false;$('sortear').disabled=false}
  };tick();
};
$('reiniciarSorteo').onclick=()=>{if(!sorteando)limpiar()};

// Cuenta atrás
const PRESETS=[10,20,30,45,50];
let duracion=30*60, restante=duracion, timer=null, fin=0;
const fmt=s=>{const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')};
function pintar(){
  const r=$('reloj');r.textContent=fmt(restante);
  r.classList.toggle('aviso',restante>0&&restante<=300);r.classList.toggle('fin',restante===0);
  $('progreso').style.width=(duracion?restante/duracion*100:0)+'%';
}
function fijar(min){
  parar();duracion=Math.round(min*60);restante=duracion;$('minutos').value=min;
  [...$('presets').children].forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.m===min)));
  $('estado').textContent='Listo para empezar';$('iniciar').textContent='Empezar';pintar();
}
PRESETS.forEach(m=>{const b=document.createElement('button');b.className='preset';b.textContent=m+' min';b.dataset.m=m;b.setAttribute('aria-pressed',String(m===30));b.onclick=()=>fijar(m);$('presets').appendChild(b)});
$('minutos').onchange=e=>{const v=Math.min(180,Math.max(1,parseInt(e.target.value)||30));fijar(v)};
let wake=null;
async function pedirWake(){try{wake=await navigator.wakeLock?.request('screen')}catch(e){}}
function parar(){clearInterval(timer);timer=null;try{wake?.release()}catch(e){}wake=null}
function correr(){
  fin=Date.now()+restante*1000;pedirWake();
  timer=setInterval(()=>{restante=Math.max(0,Math.round((fin-Date.now())/1000));pintar();
    if(restante<=300&&restante>0)$('estado').textContent='Quedan menos de 5 minutos: ve cerrando con la conclusión';
    if(restante===0){parar();$('estado').textContent='Tiempo terminado';$('iniciar').textContent='Empezar'}
  },250);
}
$('iniciar').onclick=()=>{
  if(timer){parar();$('iniciar').textContent='Seguir';$('estado').textContent='En pausa';return}
  if(restante===0)restante=duracion;
  correr();$('iniciar').textContent='Pausar';if(restante>300)$('estado').textContent='En marcha';
};
$('reiniciar').onclick=()=>fijar(Math.round(duracion/60));
$('pantalla').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};
pintar();
</script>
</body>
</html>
