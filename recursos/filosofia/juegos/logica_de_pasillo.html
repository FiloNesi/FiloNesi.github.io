<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lógica de pasillo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: una columna estrecha tipo cuaderno; cabecera con progreso arriba, barra de acción fija abajo. Acento: rotulador fluorescente sobre tinta azul. */
:root{
  --paper:#F3F5F1; --surface:#FFFFFF; --ink:#1C2640; --muted:#596277; --line:#D6DCE3;
  --mark:#F1DF45; --mark-ink:#1C2640; --sel:#E7ECF7; --chat:#E9EDE6;
  --ok:#2C8452; --ok-bg:#E3F3E9; --ko:#BF4636; --ko-bg:#FAE7E3;
  --btn:#1C2640; --btn-ink:#FFFFFF; --off:#B9C0CB;
  --c1:#3B76D1; --c2:#D07A22; --c3:#23927F; --c4:#8456CC; --c5:#C24876; --c6:#5F8A1E; --c7:#B04F33;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151E; --surface:#192030; --ink:#E6EAF1; --muted:#9BA4B6; --line:#2B3446;
  --mark:#E3D140; --mark-ink:#10151E; --sel:#22304A; --chat:#151C28;
  --ok:#5BC98A; --ok-bg:#15301F; --ko:#F27B6B; --ko-bg:#3A1D1A;
  --btn:#E6EAF1; --btn-ink:#10151E; --off:#3A4457;
  --c1:#6EA0EC; --c2:#EDA055; --c3:#4CC2AD; --c4:#AE8AEB; --c5:#EA7BA6; --c6:#93BE4D; --c7:#E0805F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151E; --surface:#192030; --ink:#E6EAF1; --muted:#9BA4B6; --line:#2B3446;
  --mark:#E3D140; --mark-ink:#10151E; --sel:#22304A; --chat:#151C28;
  --ok:#5BC98A; --ok-bg:#15301F; --ko:#F27B6B; --ko-bg:#3A1D1A;
  --btn:#E6EAF1; --btn-ink:#10151E; --off:#3A4457;
  --c1:#6EA0EC; --c2:#EDA055; --c3:#4CC2AD; --c4:#AE8AEB; --c5:#EA7BA6; --c6:#93BE4D; --c7:#E0805F;
  color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
#app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* Cabecera */
.top{display:flex;align-items:center;gap:14px;padding-block:18px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#close{width:40px;height:40px;border-radius:50%;border:0;background:var(--sel);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.bar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
#fill{height:100%;width:0;border-radius:99px;background:var(--mark);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);transition:width .35s ease}
#count{font-weight:700;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}

main{flex:1;padding-block:20px 28px;display:flex;flex-direction:column;gap:18px}
main.center{justify-content:center}

/* Tipografía */
h1,h2,.q{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.h-big{font-size:clamp(30px,6vw,42px);font-weight:800;line-height:1.08}
h2{font-size:clamp(24px,4.6vw,30px);font-weight:800;line-height:1.15}
.q{font-size:clamp(20px,3.8vw,24px);font-weight:800;line-height:1.25}
.kicker{margin:0;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.kicker span{background:var(--mark);color:var(--mark-ink);padding:2px 7px;border-radius:4px}
.lead{margin:0;color:var(--muted);font-size:18px;max-width:58ch}
.hint{margin:-8px 0 0;color:var(--muted);font-size:15px}
mark{background:linear-gradient(transparent 52%, var(--mark) 52%);color:inherit;padding:0 2px}

/* Avatares */
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;background:var(--who);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:calc(var(--s)*.42);flex:none;position:relative}
.av::after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:var(--paper);right:4%;top:4%;opacity:.9}
.av.lg{--s:58px}.av.sm{--s:34px}.av.xs{--s:28px;border:2px solid var(--surface)}
.cast{display:flex;flex-wrap:wrap;gap:16px;margin-top:6px}
.cast figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:14px}
.cast figcaption{color:var(--who)}

/* Chat */
.chat{background:var(--chat);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.stack{display:flex}.stack .av+.av{margin-left:-9px}
.chat-h b{display:block;font-family:var(--f-display);font-size:16px}
.chat-h small{color:var(--muted);font-size:13px}
.chat-b{padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.bubble{background:var(--surface);border:2px solid transparent;border-radius:4px 18px 18px 18px;padding:8px 14px;text-align:left;max-width:88%;min-width:0;display:flex;flex-direction:column}
.bubble .who{font-weight:700;font-size:13px;color:var(--who)}
.bubble.pick{border-color:var(--line);box-shadow:0 3px 0 var(--line)}
.bubble.pick:hover{border-color:var(--muted)}
.note{margin:0;display:flex;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--muted);font-style:italic}

/* Opciones genéricas */
.opts{display:flex;flex-direction:column;gap:12px}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px;text-align:left;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:hover{border-color:var(--muted)}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--line)}
.is-sel{border-color:var(--ink)!important;background:var(--sel)!important}
.is-ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.is-ko{border-color:var(--ko)!important;background:var(--ko-bg)!important}
.multi .opt{display:flex;gap:12px;align-items:flex-start}
.box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:14px;font-weight:700}
.is-sel .box{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.quote{margin:0;background:var(--surface);border-left:6px solid var(--mark);border-radius:6px 14px 14px 6px;padding:14px 18px;font-size:18px}
.locked .interactive{pointer-events:none}

/* Teoría */
.terms{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.terms li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.terms .n{width:28px;height:28px;border-radius:8px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.terms b{display:block}
.small{color:var(--muted);font-size:14px;margin:0}

/* Versus */
.vs{display:flex;flex-direction:column;gap:0;position:relative}
.vs .opt{display:flex;gap:14px;align-items:flex-start}
.vs .opt div{min-width:0}
.vs .who{font-weight:700;font-size:14px;color:var(--who);display:block}
.vs-badge{align-self:center;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;margin:-10px 0;z-index:2;font-size:15px}

/* Texto tocable */
.passage{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;font-size:19px;line-height:2}
.seg{background:transparent;border:0;border-bottom:3px dotted var(--muted);padding:2px 3px;border-radius:4px;font-size:inherit;line-height:1.5;text-align:left;display:inline}
.seg:hover{background:var(--sel)}
.seg.is-sel{background:var(--mark)!important;color:var(--mark-ink);border-bottom-color:var(--mark-ink)}
.seg.is-ok{background:var(--ok-bg)!important;border-bottom:3px solid var(--ok)}
.seg.is-ko{background:var(--ko-bg)!important;border-bottom:3px solid var(--ko)}
.fixed{color:var(--muted);font-weight:700}

/* Tarjetas */
.deck{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px 22px 26px;min-height:200px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 8px 0 -2px var(--surface),0 8px 0 0 var(--line)}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.dots i.on{width:28px;background:var(--ink)}
.dots i.done{background:var(--muted)}
.deck p{margin:auto 0;font-family:var(--f-display);font-weight:600;font-size:clamp(19px,3.6vw,23px);text-align:center;text-wrap:balance}
.deck .ct{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.deck .ct p{margin:0}
.deck .ct small{color:var(--muted);font-size:14px;text-wrap:balance}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two .opt{text-align:center;font-weight:700}
.review{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:8.5em 1fr;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:15px}
.rrow .lab{font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.rrow .fix{display:block;color:var(--ok);font-size:11px}

/* Escala */
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:end}
.scale .opt{padding:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.scale-l{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:14px;margin-top:-6px}

/* Emparejar */
.match{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0}
.match .opt{font-size:15px;position:relative;padding-right:40px}
.tag{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:13px;font-weight:700}
.col-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}

/* Montar */
.slots{display:flex;flex-direction:column;gap:10px}
.slot{display:grid;grid-template-columns:7.5em 1fr;gap:12px;align-items:center}
.slot .lab{font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.slot.concl{border-top:2px solid var(--ink);padding-top:10px}
.drop{min-height:52px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:stretch}
.drop .opt{flex:1;font-size:15px;box-shadow:none}
.pool{display:flex;flex-wrap:wrap;gap:10px}
.pool .opt{font-size:15px;padding:10px 14px}

/* Hueco y revelar */
.gap{display:inline-block;min-width:7em;border-bottom:3px dashed var(--muted);padding:0 4px}
.gap.filled{background:var(--sel);border-radius:6px 6px 0 0}
.gap.ok{color:var(--ok);background:var(--ok-bg);border-bottom-color:var(--ok)}
.gap.ko{color:var(--ko);background:var(--ko-bg);border-bottom-color:var(--ko)}
.reveal{border:2px dashed var(--line);border-radius:18px;padding:22px;min-height:90px;display:grid;place-items:center}
.reveal .ph{width:44px;height:44px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.reveal.open{place-items:start;border-color:var(--ok);background:var(--surface)}
.reveal p{margin:0}

/* Resumen */
.rule{background:var(--ink);color:var(--paper);border-radius:22px;padding:20px 22px}
.rule .kicker{color:var(--mark);margin-bottom:8px}
.rule p{margin:0;font-size:17px}
.rev{border:2px solid var(--line);border-radius:22px;padding:16px 20px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.rev .kicker{color:var(--muted)}
.rev p{margin:0}
.rev .sol{color:var(--ok);font-weight:700;font-size:15px}

/* Menú */
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.blocks{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.block{--g:var(--c2);display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 20px;background:color-mix(in srgb,var(--g) 9%,var(--surface));border:2px solid color-mix(in srgb,var(--g) 40%,var(--line));border-radius:20px;box-shadow:0 5px 0 color-mix(in srgb,var(--g) 40%,var(--line));transition:transform .08s}
.block:hover{border-color:var(--g)}
.block:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--g) 40%,var(--line))}
.block p{margin:0;color:var(--muted)}
.b-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.b-name{font-family:var(--f-display);font-weight:800;font-size:26px;color:color-mix(in srgb,var(--g) 75%,var(--ink))}
.b-count{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.block .b-list{color:var(--ink);font-size:14.5px}
.pips{display:flex;gap:6px;margin-top:2px}
.pips i{width:26px;height:7px;border-radius:9px;background:color-mix(in srgb,var(--g) 22%,var(--line))}
.pips i.on{background:var(--g)}
.back{align-self:flex-start;background:none;border:0;color:var(--muted);font-weight:700;font-size:15px;padding:4px 0}
.back:hover{color:var(--ink)}
.groups{display:flex;flex-direction:column;gap:28px;margin-top:6px}
.g-head{display:flex;flex-direction:column;gap:2px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.g-name{font-size:22px}
.g-head small{color:var(--muted);font-size:14px}
.lessons{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.lesson{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.lesson .num{width:48px;height:48px;border-radius:14px;background:var(--sel);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.lesson.done .num{background:var(--mark);color:var(--mark-ink)}
.lesson b{display:block;font-family:var(--f-display);font-size:19px}
.lesson small{color:var(--muted);font-size:14px}
.lesson .st{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
.lesson.done .st{color:var(--ok)}
.credit{color:var(--muted);font-size:13px;margin:8px 0 0}

/* Pie */
footer{position:sticky;bottom:0;background:var(--paper);padding-block:10px calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
#fb{border-radius:18px;padding:12px 16px;margin-bottom:10px}
#fb.ok{background:var(--ok-bg)} #fb.ko{background:var(--ko-bg)}
#fb strong{font-family:var(--f-display);font-size:19px}
#fb.ok strong{color:var(--ok)} #fb.ko strong{color:var(--ko)}
#fb p{margin:4px 0 0;font-size:15.5px;max-height:30vh;overflow:auto}
.row{display:flex;gap:12px;align-items:center}
#go{flex:1;border:0;border-radius:18px;padding:16px;font-family:var(--f-display);font-weight:800;font-size:18px;background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
#go:disabled{background:var(--off);color:var(--paper);box-shadow:none;cursor:default}
#go.ok{background:var(--ok);color:#fff} #go.ko{background:var(--ko);color:#fff}
.owl{width:52px;height:52px;flex:none}
.owl .pupil{transform-box:fill-box;transform-origin:center;transition:transform .2s}
.owl.happy .pupil{transform:scaleY(.25)}
.owl.sad .pupil{transform:translateY(2px) scale(.8)}

@media (max-width:520px){
  body{font-size:16px}
  .match{grid-template-columns:1fr}
  .rrow{grid-template-columns:1fr;gap:4px}
  .slot{grid-template-columns:1fr;gap:4px}
  .owl{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="app">
  <header class="top" id="top" hidden>
    <button id="close" type="button" aria-label="Volver al menú">×</button>
    <div class="bar" role="progressbar" aria-label="Progreso de la lección"><div id="fill"></div></div>
    <span id="count"></span>
  </header>
  <main id="main"></main>
  <footer id="foot" hidden>
    <div id="fb" hidden role="status"><strong id="fbt"></strong><p id="fbx"></p></div>
    <div class="row">
      <svg class="owl" id="owl" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M10 15 L13 5 L20 12 L28 12 L35 5 L38 15 Q43 26 38 37 Q32 45 24 45 Q16 45 10 37 Q5 26 10 15Z" fill="var(--ink)"/>
        <circle cx="18" cy="23" r="7" fill="var(--paper)"/><circle cx="30" cy="23" r="7" fill="var(--paper)"/>
        <circle class="pupil" cx="18" cy="23" r="3.2" fill="var(--ink)"/><circle class="pupil" cx="30" cy="23" r="3.2" fill="var(--ink)"/>
        <path d="M21.5 29 L24 33.5 L26.5 29Z" fill="var(--mark)"/>
      </svg>
      <button id="go" type="button">Continuar</button>
    </div>
  </footer>
</div>

<script>
/* ---------- Personajes ---------- */
const CH={
  nora:{n:'Nora',i:'N',c:'--c1'}, iker:{n:'Iker',i:'I',c:'--c2'}, vega:{n:'Vega',i:'V',c:'--c3'},
  samu:{n:'Samu',i:'S',c:'--c4'}, julia:{n:'Profe Julia',i:'J',c:'--c5'},
  papa:{n:'Papá',i:'P',c:'--c6'}, carmen:{n:'Abuela Carmen',i:'C',c:'--c7'}, marta:{n:'Prima Marta',i:'M',c:'--c1'},
  rafa:{n:'Tío Rafa',i:'R',c:'--c2'}, lia:{n:'Lía',i:'L',c:'--c3'}, pili:{n:'Tía Pili',i:'P',c:'--c5'}, tomas:{n:'Abuelo Tomás',i:'T',c:'--c7'}
};

/* ---------- Contenido ---------- */
const LESSONS=[
{ title:'¿Qué es un argumento?', sub:'Premisas, conclusión y conectores', steps:[
  {t:'intro',kicker:'Lección 1',title:'¿Qué es un argumento?',text:'Opinar es fácil. Argumentar es dar razones para que otra persona pueda comprobar si llevas razón. Hoy aprendes a distinguir una cosa de la otra.',cast:['nora','iker','vega','samu']},
  {t:'chat',title:'1º Bach B',members:['iker','nora','vega'],msgs:[
    {who:'iker',text:'El examen de Filosofía debería ser tipo test.'},
    {who:'nora',text:'¿Por qué?'},
    {who:'iker',text:'Porque sí. Porque lo digo yo.'},
    {who:'vega',text:'Yo creo que debería ser de desarrollo: en un test puedes acertar por azar y no se ve si has entendido los textos.'}],
    note:'Iker y Vega defienden algo. Solo una de las dos intervenciones da razones.'},
  {t:'versus',q:'¿Quién está argumentando?',a:{who:'iker',text:'Debería ser tipo test. Porque sí, porque lo digo yo.'},b:{who:'vega',text:'Debería ser de desarrollo: en un test puedes acertar por azar y no se ve si has entendido los textos.'},correct:'b',
    exp:'Vega ofrece una razón que se puede discutir (el azar en los test). «Porque lo digo yo» no es una razón: solo repite la opinión con más fuerza.',sol:'Vega, porque da una razón comprobable.'},
  {t:'theory',title:'Premisa y conclusión',text:'Un argumento es un conjunto de enunciados en el que unos se ofrecen como razones para aceptar otro.',items:[
    {k:'Conclusión',v:'Lo que se quiere probar. Responde a «¿qué quieres que crea?».'},
    {k:'Premisas',v:'Las razones que se dan para aceptarla. Responden a «¿por qué debería creerlo?».'},
    {k:'Conectores',v:'«porque», «ya que», «dado que» suelen introducir premisas; «por tanto», «así que», «luego», «por eso» suelen introducir la conclusión.'}],
    foot:'Truco: busca primero la conclusión. Todo lo demás está ahí para sostenerla.'},
  {t:'tap',q:'Toca la conclusión.',parts:[
    {x:'La biblioteca cierra a las seis'},{x:' y ',f:1},{x:'todavía me quedan tres temas'},{x:', así que ',f:1},{x:'hoy no me da tiempo a repasar Historia'},{x:'.',f:1}],correct:4,
    exp:'«Así que» anuncia la conclusión: hoy no me da tiempo a repasar Historia. Lo del horario y los temas pendientes son las premisas.',sol:'«Hoy no me da tiempo a repasar Historia» (va tras «así que»).'},
  {t:'cards',q:'¿Solo opinión o argumento?',labels:['Solo opinión','Argumento'],items:[
    {x:'«El nuevo horario es horrible».',a:0},
    {x:'«Habría que quitar la séptima hora: llegamos agotados a Física y las notas de esa asignatura han bajado».',a:1},
    {x:'«El reguetón es lo peor que ha pasado a la música».',a:0},
    {x:'«Prohibir el móvil en el recreo es un error, ya que es el único rato para hablar con gente de otros cursos».',a:1},
    {x:'«Los de 2º son insoportables».',a:0}],
    exp:'Hay argumento cuando aparece al menos una razón a favor de lo que se afirma. Una opinión sin razones, por rotunda que sea, no es un argumento.',sol:'Argumentos: el de la séptima hora y el del móvil en el recreo. El resto son opiniones sin razones.'},
  {t:'multi',q:'Marca todas las premisas que apoyan la conclusión.',quote:'Conclusión: «Deberíamos hacer el viaje de fin de curso a Granada».',opts:[
    'El viaje a Granada cuesta 120 € menos por persona que el de Roma.',
    'La Alhambra entra en el temario de Historia del Arte.',
    'A Iker le gusta más Roma.',
    'Se puede ir en tren, sin coger avión.',
    'Granada y Galicia empiezan por la misma letra.'],correct:[0,1,3],
    exp:'El precio, el valor para el temario y la facilidad del viaje son razones a favor de Granada. Que a Iker le guste Roma, si acaso, apoya lo contrario; y lo de la letra no tiene nada que ver.',sol:'El precio, la Alhambra en el temario y el viaje en tren.'},
  {t:'mcq',q:'¿Qué pasa con este argumento?',quote:'«El agua hierve a 100 °C a nivel del mar, porque me lo ha dicho mi hermano y él nunca se equivoca».',opts:[
    'La conclusión es falsa.',
    'La conclusión es verdadera, pero la razón que se da no sirve para probarla.',
    'Es un buen argumento, porque la conclusión es cierta.'],correct:1,
    exp:'Que algo sea verdad no hace bueno al argumento que lo defiende. Nadie «nunca se equivoca», así que la premisa no sostiene nada: acertar de rebote no es argumentar bien.',sol:'Conclusión verdadera, pero la razón no la prueba.'},
  {t:'chatPick',q:'Papá propone ir a la sierra. ¿Qué mensaje da una razón que no sostiene la propuesta?',title:'Familia',members:['papa','carmen','marta','rafa'],msgs:[
    {who:'papa',text:'Propongo que este sábado vayamos a la sierra.',pick:false},
    {who:'carmen',text:'Buena idea: dan sol y no va a pasar de 22 grados.'},
    {who:'marta',text:'Y la ruta que queríamos hacer tiene sombra casi todo el camino.'},
    {who:'rafa',text:'Sí, sí, vamos, que el coche nuevo es rojo.'}],correct:3,
    exp:'El tiempo y la sombra de la ruta son razones para ir a la sierra. El color del coche no tiene relación con la propuesta: parece una razón, pero no sostiene nada.',sol:'El mensaje de Tío Rafa (el color del coche).'},
  {t:'build',q:'Monta un argumento a favor de que Nora se presente a delegada.',hint:'Toca las fichas para colocarlas. Sobran dos.',slots:['p','p','c'],chips:[
    {x:'Nora siempre media cuando hay un conflicto en clase.',r:'p'},
    {x:'Por tanto, Nora debería presentarse a delegada.',r:'c'},
    {x:'Nora tiene muchos seguidores en Instagram.',r:'x'},
    {x:'El curso pasado Nora consiguió que movieran dos exámenes que coincidían.',r:'p'},
    {x:'Nora se sienta en primera fila.',r:'x'}],
    exp:'Las dos premisas muestran cualidades útiles para ser delegada (mediar, conseguir cambios) y la conclusión va tras «por tanto». Los seguidores y el sitio en clase no dicen nada sobre cómo lo haría.',sol:'Premisas: media en los conflictos y consiguió mover dos exámenes. Conclusión: debería presentarse.'},
  {t:'tap',q:'A veces no hay conector. Toca la conclusión.',parts:[
    {x:'No te apuntes a esa academia.'},{x:' ',f:1},{x:'Cobran la matrícula entera aunque te vayas el primer mes'},{x:', y ',f:1},{x:'a mi prima le cambiaron de profesor tres veces en un trimestre'},{x:'.',f:1}],correct:0,
    exp:'Pregúntate qué quiere que creas quien habla: que no te apuntes. Lo demás son las razones. En la conversación real la conclusión suele ir primero y sin aviso.',sol:'«No te apuntes a esa academia».'},
  {t:'summary',lead:'Ya distingues una opinión de un argumento y sabes localizar premisas y conclusión, con conector o sin él.',
    rule:'Un argumento no es una opinión dicha con fuerza: es una conclusión apoyada en premisas. Busca primero qué quieren que creas y después por qué deberías creerlo. Los conectores ayudan, pero no siempre aparecen.',
    biblio:'Anthony Weston, Las claves de la argumentación (Ariel). Irving M. Copi y Carl Cohen, Introducción a la lógica (Limusa).'}
]},
{ title:'Verdad no es validez', sub:'Validez, verdad y solidez', steps:[
  {t:'intro',kicker:'Lección 2',title:'Verdad no es validez',text:'Un argumento puede estar bien construido y decir tonterías, o decir verdades por casualidad. Hoy separas dos preguntas que solemos mezclar.',cast:['vega','samu','iker','julia']},
  {t:'chat',title:'Filo 1º B',members:['samu','iker','vega'],msgs:[
    {who:'samu',text:'Todos los gatos vuelan. Michi es un gato. Así que Michi vuela.'},
    {who:'iker',text:'Eso está fatal razonado.'},
    {who:'vega',text:'El razonamiento está bien. Lo que está mal es la primera frase.'}],
    note:'¿Quién tiene razón? Al final de la lección lo sabrás (pista: Vega).'},
  {t:'theory',title:'Validez y verdad',text:'Son preguntas distintas que se hacen a cosas distintas.',items:[
    {k:'Verdad',v:'Se dice de cada enunciado: ¿encaja con la realidad?'},
    {k:'Validez',v:'Se dice del argumento deductivo entero: ¿se sigue la conclusión de las premisas?'},
    {k:'La prueba',v:'Imagina que las premisas son verdaderas, aunque no lo sean. ¿Podría ser falsa la conclusión? Si es imposible, el argumento es válido.'}],
    foot:'Por eso el de Michi es válido: si todos los gatos volaran y Michi fuera un gato, Michi volaría sin remedio.'},
  {t:'mcq',q:'¿Cómo es este argumento?',quote:'«Todos los planetas son de chocolate. La Luna es un planeta. Luego la Luna es de chocolate».',opts:[
    'Inválido, porque todo lo que dice es falso.',
    'Válido, aunque las premisas y la conclusión sean falsas.',
    'Válido y con conclusión verdadera.'],correct:1,
    exp:'Si las dos premisas fueran ciertas, la conclusión tendría que serlo. Eso basta para que sea válido. Que todo sea falso afecta a la verdad, no a la validez.',sol:'Válido, con premisas y conclusión falsas.'},
  {t:'versus',q:'Lee el argumento y elige quién lo juzga bien.',quote:'«Todos los perros son mamíferos. Todos los gatos son mamíferos. Luego ningún gato es un perro».',a:{who:'iker',text:'Es válido: todo lo que dice es verdad.'},b:{who:'nora',text:'Es inválido: que los dos sean mamíferos no obliga a que no coincidan. Acierta de chiripa.'},correct:'b',
    exp:'Con premisas de la misma forma podrías llegar a algo falso: «Todos los perros son mamíferos. Todos los caniches son mamíferos. Luego ningún caniche es un perro». La conclusión verdadera no salva la forma.',sol:'Nora: es inválido aunque todo sea verdad.'},
  {t:'cards',q:'¿Válido o inválido?',labels:['Válido','Inválido'],items:[
    {x:'«Si llueve, se suspende la excursión. Llueve. Luego se suspende».',a:0},
    {x:'«Si llueve, se suspende la excursión. Se ha suspendido. Luego ha llovido».',a:1},
    {x:'«Todos los de 1º B tienen Física. Lucas no tiene Física. Luego Lucas no es de 1º B».',a:0},
    {x:'«Algunos alumnos juegan al ajedrez. Algunos ajedrecistas son zurdos. Luego algunos alumnos son zurdos».',a:1}],
    exp:'En el segundo, la excursión pudo suspenderse por otro motivo (una huelga de autobuses, por ejemplo). En el cuarto, los ajedrecistas zurdos podrían no ser alumnos. En los otros dos es imposible que las premisas sean verdaderas y la conclusión falsa.',sol:'Válidos: el primero y el tercero. Inválidos: el segundo y el cuarto.'},
  {t:'theory',title:'Argumento sólido',text:'Lo que de verdad queremos es la combinación de las dos cosas.',items:[
    {k:'Sólido',v:'Válido y con todas sus premisas verdaderas.'},
    {k:'Lo que garantiza',v:'Su conclusión es verdadera necesariamente. Por eso es el argumento deductivo ideal.'},
    {k:'No sólido',v:'Basta con que sea inválido o con que tenga una premisa falsa.'}]},
  {t:'mcq',q:'¿Cómo clasificas este argumento?',quote:'«Todos los mamíferos respiran con pulmones. Los delfines son mamíferos. Luego los delfines respiran con pulmones».',opts:[
    'Válido, pero no sólido.',
    'Sólido.',
    'Inválido.'],correct:1,
    exp:'La forma es válida y las dos premisas son verdaderas, aunque el delfín viva en el agua. Válido más premisas verdaderas: sólido.',sol:'Sólido.'},
  {t:'match',q:'Une cada argumento con su diagnóstico.',hint:'Toca un argumento y luego su diagnóstico.',left:[
    '«Todos los peces viven en el agua. El tiburón es un pez. Luego vive en el agua».',
    '«Todos los profesores son de Madrid. Julia es profesora. Luego Julia es de Madrid».',
    '«Si estudias, apruebas. Has aprobado. Luego has estudiado».'],right:['Sólido','Válido con una premisa falsa','Inválido'],pairs:[0,1,2],
    exp:'El del tiburón es válido y con premisas verdaderas. El de Julia es válido, pero no todos los profesores son de Madrid. El último es inválido: pudiste aprobar por otra razón.',sol:'Tiburón: sólido. Julia: válido con premisa falsa. Aprobar: inválido.'},
  {t:'chatPick',q:'¿Quién confunde verdad y validez?',title:'Filo 1º B',members:['julia','nora','samu','iker'],msgs:[
    {who:'julia',text:'Analizad este: «Todos los pájaros vuelan. El pingüino es un pájaro. Luego el pingüino vuela».',pick:false},
    {who:'nora',text:'La conclusión es falsa, pero el razonamiento es válido.'},
    {who:'samu',text:'El fallo está en la primera premisa: no todos los pájaros vuelan.'},
    {who:'iker',text:'Si la conclusión es falsa, el argumento tiene que ser inválido.'}],correct:3,
    exp:'Iker deduce la invalidez a partir de la falsedad. Pero un argumento válido puede terminar en algo falso si alguna premisa es falsa, que es justo lo que pasa aquí.',sol:'Iker: una conclusión falsa no hace inválido el argumento.'},
  {t:'mcq',q:'¿Cuál de estas combinaciones es imposible?',opts:[
    'Inválido, con premisas verdaderas y conclusión verdadera.',
    'Válido, con premisas verdaderas y conclusión falsa.',
    'Válido, con alguna premisa falsa y conclusión verdadera.'],correct:1,
    exp:'Es la propia definición de validez: si las premisas son verdaderas, la conclusión no puede ser falsa. Las otras dos combinaciones sí se dan.',sol:'Válido, premisas verdaderas y conclusión falsa.'},
  {t:'summary',lead:'Ya separas la verdad (¿encaja con la realidad?) de la validez (¿se sigue la conclusión?) y reconoces un argumento sólido.',
    rule:'Validez y verdad son preguntas distintas. Un argumento válido puede acabar en algo falso y uno inválido puede acertar por casualidad. Solo hay una combinación imposible: válido, premisas verdaderas y conclusión falsa. Por eso un argumento sólido garantiza su conclusión.',
    biblio:'Irving M. Copi y Carl Cohen, Introducción a la lógica (Limusa).'}
]},
{ title:'¿Qué hace bueno a un argumento?', sub:'Aceptabilidad, relevancia y suficiencia', steps:[
  {t:'intro',kicker:'Lección 3',title:'¿Qué hace bueno a un argumento?',text:'Fuera de la lógica formal, casi nadie razona con silogismos. Necesitas tres preguntas rápidas para juzgar cualquier argumento del día a día.',cast:['iker','samu','vega','nora']},
  {t:'chat',title:'Pasillo 2ª planta',members:['iker','samu','vega'],msgs:[
    {who:'iker',text:'Vendo mis apuntes de Historia de 2º. Son los mejores: los usa medio insti y yo saqué un 9.'},
    {who:'samu',text:'¡Me los quedo! ¿Cuánto pides?'},
    {who:'vega',text:'Espera, Samu. ¿El 9 fue con la misma profesora que vas a tener tú?'},
    {who:'iker',text:'Bueno, era otra. Pero los apuntes son muy bonitos, tienen colores.'}],
    note:'Iker da razones. La pregunta es si bastan.'},
  {t:'theory',title:'Aceptabilidad, relevancia, suficiencia',text:'Un argumento es bueno si sus premisas pasan tres pruebas. Si falla una, cojea. Muchas falacias son, en el fondo, el fallo de una de ellas.',ordered:true,items:[
    {k:'Aceptabilidad',v:'¿Hay buenas razones para creer la premisa?'},
    {k:'Relevancia',v:'¿La premisa tiene que ver con la conclusión?'},
    {k:'Suficiencia',v:'¿Basta lo que se ofrece para sostener la conclusión?'}]},
  {t:'chatPick',q:'¿Qué mensaje se apoya en algo que no hay razón para creer?',title:'Familia',members:['papa','lia','pili','tomas'],msgs:[
    {who:'papa',text:'Ha nevado y han cortado la carretera del puerto. Mejor subimos mañana.'},
    {who:'lia',text:'La DGT avisa de que hacen falta cadenas en la sierra.'},
    {who:'pili',text:'Yo subo hoy, que la app de tarot dice que es mi día de suerte.'},
    {who:'tomas',text:'Pili, la app también te dijo que aprobarías el carné a la primera.'}],correct:2,
    exp:'El corte de la carretera y el aviso de la DGT son información fiable. Que el tarot prediga tu suerte no tiene ningún respaldo: la premisa no es aceptable.',sol:'El mensaje de Tía Pili (el tarot).'},
  {t:'versus',q:'«Este móvil tiene buena batería». ¿Quién lo defiende con una razón que viene al caso?',a:{who:'nora',text:'Aguantó dos días de uso normal en la prueba de una revista de tecnología.'},b:{who:'iker',text:'Lo lleva todo el mundo y el color es precioso.'},correct:'a',
    exp:'La prueba de duración habla de la batería. La popularidad y el color hablan de otras cosas: no son relevantes para esa conclusión.',sol:'Nora: la prueba de duración es relevante.'},
  {t:'cards',q:'¿La premisa es relevante para la conclusión?',labels:['Relevante','Irrelevante'],items:[
    {x:'«No le hagas caso sobre el cambio climático: es muy borde».',a:1},
    {x:'«No le dejes los apuntes: no devolvió ni los de Lengua ni los de Química».',a:0},
    {x:'«Su comentario de texto es malo: va al gimnasio todos los días».',a:1},
    {x:'«Esta ruta es segura: Protección Civil la revisó este mes».',a:0}],
    exp:'Ser borde no dice nada sobre si alguien acierta en un tema, ni ir al gimnasio sobre un comentario de texto. En cambio, no haber devuelto apuntes antes sí tiene que ver con prestárselos, y una revisión reciente sí tiene que ver con la seguridad.',sol:'Relevantes: los apuntes no devueltos y la revisión de Protección Civil.'},
  {t:'mcq',q:'¿Qué argumento tiene premisas verdaderas y relevantes, pero insuficientes?',opts:[
    '«Muchos estudios muestran que dormir menos de seis horas reduce la atención, así que trasnochar antes de un examen te perjudica».',
    '«Mi primo duerme cuatro horas y saca buenas notas, así que dormir poco no afecta al rendimiento».',
    '«Ensayos con miles de estudiantes muestran que dormir bien mejora la memoria, así que conviene dormir antes de un examen».'],correct:1,
    exp:'Lo del primo puede ser verdad y tiene que ver con el tema, pero un solo caso no basta para una conclusión general. Las otras dos se apoyan en muchos datos.',sol:'El del primo: un solo caso no basta.'},
  {t:'scale',q:'Iker insiste: «Yo saqué un 9 con estos apuntes». ¿Cuánto te asegura eso que a ti te van a servir?',ok:[1,2],
    exp:'Algo aporta, pero poco: es un solo caso, con otra profesora y quizá con otro examen. Su experiencia no basta para garantizar la tuya. Valían 1 o 2.',sol:'Poco: 1 o 2 sobre 5.'},
  {t:'cards',q:'¿Qué prueba falla: relevancia o suficiencia?',labels:['Relevancia','Suficiencia'],items:[
    {x:'«El transporte público no funciona: ayer el autobús llegó tarde».',a:1},
    {x:'«Es buen entrenador: tiene una voz muy agradable».',a:0},
    {x:'«Este instituto es un desastre: a un amigo le perdieron un examen».',a:1},
    {x:'«Esa serie es buenísima: el cartel es precioso».',a:0},
    {x:'«La cafetería es malísima: fui un día y el bocadillo estaba frío».',a:1},
    {x:'«No votes su candidatura a delegado: lleva unas zapatillas horribles».',a:0}],
    exp:'Cuando la razón habla de otra cosa (la voz, el cartel, las zapatillas) falla la relevancia. Cuando habla del tema pero es un caso aislado (un autobús, un examen, un bocadillo) falla la suficiencia.',sol:'Relevancia: voz, cartel, zapatillas. Suficiencia: autobús, examen perdido, bocadillo.'},
  {t:'multi',q:'¿Qué pruebas falla este argumento?',quote:'«Un streamer con dos millones de seguidores dijo que una criptomoneda iba a subir, y subió. Así que voy a meter todos mis ahorros en la que recomiende ahora».',opts:['Aceptabilidad','Relevancia','Suficiencia'],correct:[1,2],
    exp:'Las premisas son creíbles (lo dijo y subió), así que la aceptabilidad pasa. Pero tener seguidores no le convierte en experto en inversiones (relevancia), y un solo acierto no basta para jugarte tus ahorros (suficiencia).',sol:'Relevancia y suficiencia.'},
  {t:'summary',lead:'Ya tienes las tres lupas: aceptabilidad, relevancia y suficiencia. Y ya sabes qué contestarle a Iker sobre sus apuntes.',
    rule:'Un buen argumento pasa tres pruebas a la vez: premisas aceptables (¿creíbles?), relevantes (¿vienen al caso?) y suficientes (¿bastan?). Si falla una, el argumento cojea.',
    biblio:'Ralph H. Johnson y J. Anthony Blair, Logical Self-Defense (1977). Trudy Govier, A Practical Study of Argument.'}
]},
{ title:'Sesgo de confirmación', sub:'Buscar, recordar e interpretar a tu favor', steps:[
  {t:'intro',kicker:'Lección 4',title:'Sesgo de confirmación',text:'Tu cabeza tiene un abogado que solo defiende lo que ya piensas. Hoy aprendes a pillarlo en el grupo de la familia y en clase.',cast:['papa','lia','pili','samu','vega']},
  {t:'chat',title:'Familia',members:['lia','papa','carmen'],msgs:[
    {who:'lia',text:'Estoy mirando un móvil nuevo. ¿Qué tal esta marca?'},
    {who:'papa',text:'Malísima, lo sabe todo el mundo. He buscado «problemas de esa marca» y salen miles de quejas. ¿Veis? Lo sabía.'},
    {who:'lia',text:'¿Y si buscas «lo mejor de esa marca»? Saldrán otras miles.'},
    {who:'carmen',text:'Hijo, busca «problemas de tu coche» y mañana lo vendes.'}],
    note:'Papá dice «lo sabía» antes de buscar. Fíjate en cómo ha buscado.'},
  {t:'theory',title:'Buscas lo que ya crees',text:'El sesgo de confirmación es la tendencia a buscar, recordar e interpretar la información a favor de lo que ya crees. A lo que te contradice le das menos peso.',
    foot:'No es mentir: miras menos hacia el otro lado y, cuando miras, le exiges más.'},
  {t:'chatPick',q:'Tía Pili cree en el horóscopo. ¿En qué mensaje se cuela el sesgo?',title:'Familia',members:['pili','lia','tomas'],msgs:[
    {who:'pili',text:'La app del horóscopo dice que tendré una semana tranquila.'},
    {who:'lia',text:'Tía, ¿llevas la cuenta de cuántas veces acierta y cuántas falla?'},
    {who:'pili',text:'Me acuerdo de las dos veces que acertó de lleno. Las que falló se me olvidan: serían poca cosa.'},
    {who:'tomas',text:'Apúntalas todas durante un mes, Pili. Las que aciertan y las que no.'}],correct:2,
    exp:'Tía Pili retiene los aciertos y olvida los fallos. Así cualquier predicción parece fiable. El abuelo propone lo contrario: contar todos los casos, también los que no encajan.',sol:'El segundo mensaje de Tía Pili (recuerda solo los aciertos).'},
  {t:'scale',q:'¿Cuánto demuestra esa búsqueda que la pizzería es mala?',quote:'Samu está convencido de que la pizzería de al lado del insti es mala. Tiene 600 reseñas: filtra solo las de una estrella, lee veinte y dice «lo sabía».',ok:[1,2],
    exp:'Casi nada: ha buscado justo las reseñas que le darían la razón. Con ese filtro, cualquier sitio con cientos de reseñas parecería malo. Para comprobarlo tendría que leer también las buenas y las normales.',sol:'Casi nada: 1 o 2 sobre 5.'},
  {t:'theory',title:'Entra por tres puertas',text:'El sesgo no solo cambia lo que buscas.',ordered:true,items:[
    {k:'Al buscar',v:'Eliges fuentes y personas que te van a dar la razón.'},
    {k:'Al recordar',v:'Retienes los casos que encajan y olvidas los que no.'},
    {k:'Al interpretar',v:'Si un dato es ambiguo, lo lees a favor de tu idea.'}]},
  {t:'match',q:'Empareja cada frase con la puerta por la que entra el sesgo.',hint:'Toca una frase y luego su puerta.',left:[
    '«Solo pregunto a mis amigos, que piensan como yo».',
    '«Me acuerdo justo de las veces que acerté».',
    '«Ya sabía que no le caigo bien: su mensaje seco lo demuestra».'],right:['Al buscar','Al interpretar','Al recordar'],pairs:[0,2,1],
    exp:'Preguntar solo a quien piensa como tú es buscar con filtro. Quedarte con los aciertos es recordar a tu favor. Leer un mensaje seco como prueba de antipatía es interpretar un dato ambiguo a favor de lo que ya creías.',sol:'Amigos: al buscar. Aciertos: al recordar. Mensaje seco: al interpretar.'},
  {t:'fill',pre:'Para poner a prueba tu propia idea, pregúntate:',post:'Si no tienes respuesta, quizá no estabas razonando, solo defendiéndote.',opts:[
    '«¿Cuánta gente piensa igual que yo?»',
    '«¿Cómo convenzo a quien no piensa igual?»',
    '«¿Qué prueba me haría cambiar de opinión?»'],correct:2,
    exp:'Preguntarte qué te haría cambiar de idea te obliga a mirar la evidencia contraria. Las otras dos preguntas solo alimentan la idea que ya tenías.',sol:'«¿Qué prueba me haría cambiar de opinión?»'},
  {t:'reflect',q:'Piensa en una opinión fuerte que tengas ahora mismo. ¿Cuándo fue la última vez que buscaste en serio un buen argumento en su contra?',hint:'Calma: nos pasa a todos. El primer paso es darse cuenta.',
    reveal:'Si la respuesta es «nunca» o «no me acuerdo», no significa que tengas razón: significa que llevas tiempo sin ponerte a prueba. Así es como se siente estar dentro del sesgo: no se nota.'},
  {t:'cards',q:'¿Este hábito alimenta el sesgo o lo frena?',labels:['Lo alimenta','Lo frena'],items:[
    {x:'Quedarte con el dato que te da la razón.',a:0},
    {x:'Buscar a propósito el mejor argumento contrario.',a:1},
    {x:'Seguir solo a cuentas que opinan como tú.',a:0},
    {x:'Recordar solo las veces que acertaste.',a:0},
    {x:'Preguntarte qué prueba te haría cambiar de idea.',a:1},
    {x:'Leer reseñas buenas y malas antes de comprar.',a:1}],
    exp:'Lo alimentan los hábitos que te rodean de «síes». Lo frenan los que te ponen delante, a propósito, un «no» bien argumentado. Frenar no es apagar: el sesgo no desaparece, pero pierde fuerza.',sol:'Lo frenan: buscar el mejor argumento contrario, preguntarte qué te haría cambiar de idea y leer reseñas buenas y malas.'},
  {t:'tap',q:'Toca el momento exacto en que se cuela el sesgo.',parts:[
    {x:'Nora cree que usar el móvil en clase baja las notas.'},{x:' ',f:1},
    {x:'Encuentra dos estudios: uno le da la razón y el otro no encuentra ningún efecto.'},{x:' ',f:1},
    {x:'Los lee los dos con calma,'},{x:' ',f:1},
    {x:'pero al que la contradice le busca tres fallos y al otro, ninguno.'}],correct:6,
    exp:'Buscar y leer ambos estudios está bien. El sesgo aparece al juzgarlos con distinta vara: al que no le gusta le exige mucho más que al que le da la razón.',sol:'«Al que la contradice le busca tres fallos y al otro, ninguno».'},
  {t:'versus',q:'Vega y Samu creen que el ficus del aula se muere porque lo riegan demasiado. ¿Quién pone a prueba su idea?',a:{who:'vega',text:'Lo dejamos una semana sin regar. Si no mejora, nos equivocábamos.'},b:{who:'samu',text:'He mirado en foros: un montón de gente dice que se le murió la planta por regarla mucho.'},correct:'a',
    exp:'Vega diseña una prueba que podría darle la razón o quitársela, y dice de antemano qué resultado la refutaría. Samu solo junta casos que confirman lo que ya pensaba.',sol:'Vega: plantea una prueba que podría refutar su idea.'},
  {t:'summary',lead:'Ya sabes cómo se cuela el sesgo de confirmación al buscar, al recordar y al interpretar, y cómo frenarlo yendo a por lo que te contradice.',
    rule:'Antes de dar algo por cierto, pregúntate: «¿Qué prueba me haría cambiar de idea?». Y luego ve a buscarla de verdad.',
    biblio:'Raymond S. Nickerson, «Confirmation bias: A ubiquitous phenomenon in many guises», Review of General Psychology (1998). Lord, Ross y Lepper (1979), sobre cómo juzgamos los estudios según nos den o no la razón. Lord, Lepper y Preston (1984), sobre la estrategia de «considerar lo contrario».'}
]},
{ title:'Lo que se da por supuesto', sub:'Premisas ocultas', steps:[
  {t:'intro',kicker:'Lección 5',title:'Lo que se da por supuesto',text:'El punto flojo de un argumento suele estar en lo que no dice. Hoy aprendes a sacarlo a la luz.',cast:['iker','nora','vega','pili','papa']},
  {t:'chat',title:'Pandilla',members:['iker','nora','vega'],msgs:[
    {who:'iker',text:'Estoy en la puerta del kebab nuevo. Ahí no entramos: está vacío.'},
    {who:'nora',text:'¿Y qué tiene de malo que esté vacío?'},
    {who:'iker',text:'Pues que será malo. Si fuera bueno, estaría lleno.'},
    {who:'vega',text:'Iker, son las cinco de la tarde. Vacíos están todos.'}],
    note:'Iker da algo por supuesto sin decirlo. Vega lo ha pillado.'},
  {t:'theory',title:'Premisa oculta',text:'Es una afirmación que el argumento necesita para sostenerse pero que no dice. Funciona porque la aceptas sin examinarla.',ordered:true,items:[
    {k:'Razón dicha',v:'«Está vacío».'},
    {k:'Premisa oculta (no dicha)',v:'«Si un sitio es bueno, siempre está lleno».'},
    {k:'Conclusión',v:'«Será malo».'}],
    foot:'En cuanto la dices en voz alta, se ve que no aguanta: a las cinco de la tarde no hay nadie en ningún sitio.'},
  {t:'versus',q:'«Ha sacado la mejor nota del examen de Física, así que es la que más sabe de Física». ¿Quién ha detectado el supuesto?',a:{who:'nora',text:'Da por hecho que la nota de un examen mide todo lo que sabes de una materia.'},b:{who:'vega',text:'Da por hecho que los exámenes son siempre justos.'},correct:'a',
    exp:'Para pasar de «la mejor nota» a «la que más sabe» hace falta suponer que un examen mide todo lo que sabes. Y un examen solo recoge una parte, y en un día concreto. Que los exámenes sean justos es otra cuestión: no es lo que une la razón con la conclusión.',sol:'Nora: supone que la nota mide todo lo que se sabe.'},
  {t:'theory',title:'Cómo se caza',text:'Pregúntate qué tendría que ser verdad para pasar de la razón a la conclusión. Lo que rellena ese hueco es la premisa oculta.',ordered:true,items:[
    {k:'¿Cuál es la conclusión?',v:'Lo que te quieren hacer creer.'},
    {k:'¿Cuál es la razón dicha?',v:'El dato o el motivo que sí aparece.'},
    {k:'¿Qué falta para saltar de una a otra?',v:'Eso es la premisa oculta. Ahora júzgala por separado.'}]},
  {t:'chatPick',q:'¿Qué mensaje se apoya en un supuesto que no aguanta?',title:'Familia',members:['lia','pili','papa','carmen'],msgs:[
    {who:'lia',text:'Mañana hay huelga de metro. Salid antes, que irá lleno a reventar.'},
    {who:'pili',text:'Y ha refrescado mucho: abrigaos para la cena del sábado.'},
    {who:'papa',text:'Para la cena, el restaurante que salió en la tele. Si sale en la tele, se come de maravilla.'},
    {who:'carmen',text:'Hijo, en la tele también salen los anuncios de las tres de la mañana.'}],correct:2,
    exp:'Lía y Tía Pili se apoyan en supuestos razonables: con huelga, los pocos trenes que circulan van llenos; si refresca, conviene abrigarse. Papá supone que salir en la tele garantiza calidad, y eso no aguanta: en la tele sale cualquiera que pague o que llame la atención.',sol:'El mensaje de Papá (salir en la tele no garantiza nada).'},
  {t:'cards',q:'¿El supuesto aguanta?',labels:['No aguanta','Aguanta'],items:[
    {x:'«En los institutos donde más se usan tablets hay mejores notas: las tablets suben las notas».',sub:'supone: si dos cosas van juntas, una causa la otra',a:0},
    {x:'«Ha salido cara cinco veces seguidas: ahora toca cruz».',sub:'supone: la moneda compensa las rachas',a:0},
    {x:'«El puente lleva cien años en pie y pasó la revisión el mes pasado: mañana aguantará».',sub:'supone: lo que aguanta y pasa revisiones no se cae de un día para otro',a:1},
    {x:'«Tose y tiene fiebre: estará malo».',sub:'supone: la fiebre y la tos indican una enfermedad',a:1},
    {x:'«Firmó la autorización de la excursión: acepta sus condiciones».',sub:'supone: firmar algo implica aceptar lo firmado',a:1}],
    exp:'Que dos cosas vayan juntas no prueba que una cause la otra: los institutos con más tablets pueden tener también más recursos de todo tipo. Y una moneda no tiene memoria: cada tirada es independiente. Los otros tres supuestos son razonables, aunque no sean infalibles.',sol:'No aguantan: el de las tablets y el de la moneda. Aguantan: el puente, la fiebre y la autorización.'},
  {t:'fill',pre:'«No sigas a esa cuenta de noticias: la financia un partido». Esto da por supuesto que esa cuenta',post:'por definición.',opts:[
    'tiene una línea editorial',
    'no es de fiar',
    'tiene menos seguidores que las demás'],correct:1,
    exp:'El argumento salta de «la financia un partido» a «no la sigas». Para dar ese salto tiene que suponer que, por eso, todo lo que publique es falso. Puede ser un buen motivo para leerla con cuidado, pero no basta para descartarla sin mirar lo que dice.',sol:'«No es de fiar».'},
  {t:'multi',q:'¿Qué se da por supuesto sin decirlo?',quote:'«Hay que prohibir el móvil en clase: en el país con mejores notas de Europa está prohibido».',opts:[
    'Ese país tiene buenas notas.',
    'En ese país el móvil está prohibido en clase.',
    'Lo que funciona en un país funcionará igual aquí.',
    'La prohibición del móvil es la causa de esas notas.'],correct:[2,3],
    exp:'Las dos primeras están dichas: son la razón. Lo que no se dice es que esas notas se deban a la prohibición (podría haber muchas otras causas) y que, además, lo que funciona allí funcionará aquí.',sol:'Que lo de allí funcionará aquí y que la prohibición causa las notas.'},
  {t:'build',q:'Coloca las tres piezas.',hint:'Toca las fichas para colocarlas. Sobra una.',quote:'«Ese youtuber acertó quién ganaría la última Liga, así que hay que hacer caso a su próxima predicción».',
    slots:['r','h','c'],labels:['Razón dicha','Premisa oculta','Conclusión'],chips:[
    {x:'El fútbol es difícil de predecir.',r:'x'},
    {x:'Quien acierta una vez acertará la siguiente.',r:'h'},
    {x:'Hay que hacer caso a su próxima predicción.',r:'c'},
    {x:'Acertó quién ganaría la última Liga.',r:'r'}],
    exp:'La razón dicha es el acierto. La conclusión es hacerle caso. Lo que las une sin decirse es que quien acierta una vez acertará la siguiente, y eso no aguanta: un acierto puede ser suerte. Lo de que el fútbol es difícil de predecir no forma parte del argumento; de hecho, va en su contra.',sol:'Razón: acertó la última Liga. Premisa oculta: quien acierta una vez acertará la siguiente. Conclusión: hay que hacerle caso.'},
  {t:'match',q:'Une cada frase con lo que da por supuesto.',hint:'Toca una frase y luego su supuesto.',left:[
    '«Es una marca muy grande, será fiable».',
    '«Lo pienso yo y lo piensa todo el mundo, será cierto».',
    '«En el insti siempre se ha hecho así, es lo correcto».'],right:['Lo que mucha gente cree es verdad','El tamaño garantiza la fiabilidad','Lo tradicional es lo correcto'],pairs:[1,0,2],
    exp:'Cada frase se apoya en un supuesto que, dicho en voz alta, se puede discutir: las empresas grandes también fallan, la mayoría se equivoca a veces y lo de siempre no es correcto solo por ser lo de siempre. Verás estos tres supuestos como falacias propias más adelante.',sol:'Marca grande: el tamaño garantiza fiabilidad. Todo el mundo: lo que mucha gente cree es verdad. Siempre así: lo tradicional es lo correcto.'},
  {t:'mcq',q:'«Es legal, así que no tiene nada de malo». ¿Qué se da por supuesto?',opts:[
    'Todo lo que es legal está bien.',
    'Hay una ley que lo permite.',
    'Todo lo que es ilegal está mal.'],correct:0,
    exp:'Que haya una ley que lo permite es la razón dicha. Para saltar a «no tiene nada de malo» hay que suponer que lo legal y lo bueno coinciden siempre, y no es así: hay cosas legales que pueden hacer daño. «Lo ilegal está mal» es otra idea distinta, que este argumento no necesita.',sol:'Que todo lo que es legal está bien.'},
  {t:'summary',lead:'Ya sacas a la luz lo que un argumento calla y lo juzgas aparte. Muchas falacias son justo eso: un supuesto escondido que no aguanta.',
    rule:'Casi todo argumento se apoya en algo que no dice. Antes de aceptarlo, saca el supuesto a la luz y júzgalo por separado.',
    biblio:'Eric Dayton y Kristin Rodier, Critical Thinking, Logic, and Argument (AU Press). Anthony Weston, Las claves de la argumentación (Ariel).'}
]},
{ title:'El hombre de paja', sub:'Deformar para tumbar', steps:[
  {t:'intro',title:'El hombre de paja',text:'Hay quien no discute lo que dices, sino un muñeco con tu cara, mucho más fácil de tumbar. Hoy aprendes a verlo venir y a desmontarlo.',cast:['papa','pili','carmen','lia','iker']},
  {t:'chat',title:'Familia',members:['lia','papa','pili','carmen'],msgs:[
    {who:'lia',text:'Estaría bien comer un poco menos de carne, ¿no?'},
    {who:'papa',text:'¡O sea, que quieres prohibirla y que comamos todos lechuga!'},
    {who:'pili',text:'¿Que van a prohibir las barbacoas? Esto lo reenvío ahora mismo al grupo de las vecinas.'},
    {who:'carmen',text:'Hijo, qué bien discutes con lo que nadie ha dicho.'}],
    note:'Lía ha propuesto una cosa. Papá está discutiendo otra.'},
  {t:'theory',title:'Primero te deforman, luego te atacan',text:'El hombre de paja consiste en cambiar el argumento del otro por una versión más débil o exagerada y atacar esa versión, no la real.',
    foot:'Es como pelearte con un muñeco que has montado tú: es fácil de tumbar, pero no es tu rival.'},
  {t:'mcq',q:'Papá convierte «comer un poco menos de carne» en «prohibir la carne». ¿Qué ha hecho?',opts:[
    'Rebatir la idea de Lía con un dato.',
    'Exagerar la idea de Lía y atacar esa versión.',
    'Atacar a Lía en vez de a su idea.'],correct:1,
    exp:'Papá no aporta ningún dato ni critica a Lía como persona: cambia «un poco menos» por «prohibir» y discute contra eso. Atacar a la persona en vez de a su idea es otra falacia distinta, que verás más adelante.',sol:'Exagerar su idea y atacar esa versión.'},
  {t:'theory',title:'Cómo se monta el muñeco',text:'Casi siempre basta con uno de estos tres retoques.',ordered:true,items:[
    {k:'Exagerar',v:'Convierte «un poco» en «del todo»: «menos carne» pasa a ser «nada de carne».'},
    {k:'Simplificar',v:'Quita los matices y deja solo la versión más tosca.'},
    {k:'Inventar',v:'Te atribuye una intención que nunca expresaste: «lo que quieres es que pasemos hambre».'}]},
  {t:'mcq',row:true,q:'Un hombre de paja es simplemente burlarse o reírse de la idea del otro. ¿Verdadero o falso?',opts:['Verdadero','Falso'],correct:1,
    exp:'Puedes burlarte de una idea sin deformarla, y puedes deformarla muy en serio, sin una sola broma. Lo que define al hombre de paja es el cambio: se discute una versión que el otro no ha defendido.',sol:'Falso: lo que lo define es deformar la idea, no burlarse.'},
  {t:'match',q:'Empareja cada propuesta con la versión deformada que alguien le montó encima.',hint:'Toca una propuesta y luego su versión deformada.',left:[
    '«Deberíamos revisar cuánto tiempo pasamos con el móvil».',
    '«Me gustaría que repartiéramos mejor las tareas de casa».',
    '«Podríamos gastar con más cabeza este mes».'],right:[
    '«¡Así que no puedo comprarme nunca nada!»',
    '«¡Quieres que vivamos sin tecnología, como en la Edad Media!»',
    '«¡O sea que yo no hago nada en esta casa!»'],pairs:[1,2,0],
    exp:'En los tres casos la respuesta exagera la propuesta («revisar» se convierte en «vivir sin tecnología», «gastar con cabeza» en «no comprar nunca nada») o le añade una acusación que nadie ha hecho («tú no haces nada»).',sol:'Móvil: sin tecnología. Tareas: «yo no hago nada». Gastar con cabeza: «no puedo comprarme nada».'},
  {t:'cards',q:'Vega dice: «Deberíamos organizar mejor el viaje de fin de curso». ¿Cada respuesta trata lo que dijo o le monta un hombre de paja?',labels:['Responde a su idea','Hombre de paja'],items:[
    {x:'«O sea, que según tú el delegado lo ha hecho todo fatal».',a:1},
    {x:'«Claro, tú quieres un horario para cada minuto del viaje».',a:1},
    {x:'«Yo no lo veo: improvisar también tiene su gracia».',a:0},
    {x:'«¡De acuerdo! Hagamos una lista con fechas y presupuesto».',a:0}],
    exp:'No estar de acuerdo no es hacer un hombre de paja. «Improvisar también tiene su gracia» discrepa de lo que Vega dijo de verdad. Las dos primeras, en cambio, le atribuyen algo que no ha dicho: una acusación al delegado y un horario minuto a minuto.',sol:'Hombre de paja: «el delegado lo ha hecho fatal» y «un horario para cada minuto». Responden a su idea: las otras dos.'},
  {t:'chatPick',q:'¿Qué mensaje le monta un hombre de paja a Nora?',title:'Trabajo de Historia',members:['nora','iker','samu'],msgs:[
    {who:'nora',text:'¿Y si un día a la semana quedamos por videollamada? Nos ahorramos el autobús.'},
    {who:'iker',text:'O sea, que no quieres volver a vernos nunca. Muy bonito, Nora.'},
    {who:'samu',text:'Yo prefiero en persona: por videollamada siempre falla la conexión de alguien.'}],correct:1,
    exp:'Nora propone un día a la semana, e Iker lo convierte en «no vernos nunca» y además le añade mala intención. Samu no está de acuerdo, pero responde a lo que Nora dijo de verdad y da una razón.',sol:'El mensaje de Iker («no quieres volver a vernos nunca»).'},
  {t:'theory',title:'El antídoto: el principio de caridad',text:'Antes de responder, repite el argumento del otro como lo diría él, en su versión más fuerte y razonable.',
    foot:'Si aun así puedes rebatirlo, tu respuesta vale. Si necesitas deformarlo para tumbarlo, no lo has rebatido.'},
  {t:'fill',pre:'Interpretar el argumento del otro en su versión más razonable antes de rebatirlo se llama principio de',post:'y es el mejor antídoto contra el hombre de paja.',opts:['caridad','autoridad','precaución'],correct:0,
    exp:'Se llama principio de caridad porque le concedes al otro la mejor interpretación posible de lo que dice. Si después lo rebates, has ganado la discusión de verdad, no contra un muñeco.',sol:'Caridad.'},
  {t:'versus',q:'Samu: «No estoy seguro de que reciclar sirva de mucho». ¿Quién responde a lo que ha dicho de verdad?',a:{who:'vega',text:'O sea, que según tú hay que dejar de reciclar ya.'},b:{who:'nora',text:'¿Dudas de que sirva? Yo he leído que sí ayuda bastante. ¿Te paso el enlace?'},correct:'b',
    exp:'Samu solo ha expresado una duda. Vega la convierte en una propuesta («dejar de reciclar») que él no ha hecho. Nora responde a la duda tal como es y ofrece una prueba.',sol:'Nora: responde a la duda real con una prueba.'},
  {t:'build',q:'Te sueltan: «¡Así que quieres prohibir la carne!». Monta una respuesta tranquila que devuelva tu idea real a la mesa.',hint:'Toca las fichas para colocarlas. Sobran dos.',
    slots:['a','b','d'],labels:['Corrige','Tu idea real','Devuelve el debate'],chips:[
    {x:'He dicho comer un poco menos.',r:'b'},
    {x:'Bueno, pues prohibámosla.',r:'x'},
    {x:'¿Qué te parece eso?',r:'d'},
    {x:'Tú siempre lo exageras todo.',r:'x'},
    {x:'Yo no he dicho prohibir.',r:'a'}],
    exp:'Primero desmontas el muñeco («no he dicho prohibir»), luego pones tu idea real sobre la mesa y al final invitas al otro a discutirla. «Bueno, pues prohibámosla» acepta el muñeco, y «tú siempre lo exageras todo» pasa a atacar a la persona.',sol:'Yo no he dicho prohibir. → He dicho comer un poco menos. → ¿Qué te parece eso?'},
  {t:'summary',lead:'Ya sabes distinguir un hombre de paja: no es burlarse, es cambiar la postura del otro por una más débil y atacar esa. El antídoto es el principio de caridad.',
    rule:'Antes de responder, repite el argumento del otro como lo diría él. Si necesitas deformarlo para tumbarlo, no lo has rebatido: has golpeado a un muñeco de paja.',
    biblio:'Douglas Walton, Informal Logic: A Pragmatic Approach (Cambridge University Press, 2008). Scott Aikin y John Casey, «Straw Men, Weak Men, and Hollow Men», Argumentation (2011).'}
]}
];
const GROUPS=[
  {name:'Fundamentos',sub:'Qué es un argumento y cómo se juzga',col:'--c2',ids:[0,1,2,4]},
  {name:'Sesgos',sub:'Las trampas de tu propia cabeza',col:'--c3',ids:[3]},
  {name:'Falacias',sub:'Argumentos que parecen buenos y no lo son',col:'--c4',ids:[5]}];
function groupOf(n){const g=GROUPS.find(g=>g.ids.includes(n));return g?g.name:''}

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function btn(cls,txt){const b=el('button',cls,txt);b.type='button';return b}
function av(k,size){const a=el('span','av '+(size||''),CH[k].i);a.style.setProperty('--who','var('+CH[k].c+')');a.setAttribute('aria-hidden','true');return a}
function whoColor(node,k){node.style.setProperty('--who','var('+CH[k].c+')')}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DONE_KEY='logica-pasillo-done';

const main=$('#main'),go=$('#go'),fb=$('#fb'),owl=$('#owl');
let L=0,I=0,wrong=[],cur=null,phase='idle',revealFn=()=>{};

/* ---------- Menú ---------- */
let G=0;
function screen(){$('#top').hidden=true;$('#foot').hidden=true;main.className='fade';void main.offsetWidth;main.replaceChildren();window.scrollTo(0,0)}
function brandRow(){const b=el('div','brand');b.append(owlMini(),el('span','','FiloNesi · Filosofía 1º Bach'));return b}
function showHome(){
  screen();
  const done=store.get(DONE_KEY)||{};
  const lead=el('p','lead','Lecciones cortas para aprender a reconocer, juzgar y construir argumentos, y a pillar las trampas de tu propia cabeza, con ejemplos del instituto. Elige un bloque para empezar.');
  const list=el('div','blocks');
  GROUPS.forEach((g,gi)=>{
    const b=btn('block');b.style.setProperty('--g','var('+g.col+')');
    const n=g.ids.filter(i=>done[LESSONS[i].title]).length;
    const top=el('div','b-top');top.append(el('span','b-name',g.name),el('span','b-count',n+' de '+g.ids.length+' hechas'));
    const pips=el('div','pips');g.ids.forEach(i=>pips.append(el('i',done[LESSONS[i].title]?'on':'')));
    const ls=el('p','b-list',g.ids.map(i=>LESSONS[i].title).join(' · '));
    b.append(top,el('p','',g.sub),ls,pips);
    b.onclick=()=>showGroup(gi);list.append(b);
  });
  main.append(brandRow(),el('h1','h-big','Lógica de pasillo'),lead,list,el('p','credit','Inés Pradana · Recurso educativo abierto'));
}
function showGroup(gi){
  G=gi;screen();const g=GROUPS[gi];
  const done=store.get(DONE_KEY)||{};
  const back=btn('back','← Todos los bloques');back.onclick=showHome;
  const k=el('p','kicker');k.append(el('span','','Bloque '+(gi+1)+' de '+GROUPS.length));
  const ls=el('div','lessons');
  g.ids.forEach((n,j)=>{
    const les=LESSONS[n],d=done[les.title];
    const b=btn('opt lesson'+(d?' done':''));
    const t=el('span');t.append(el('b','',les.title),el('small','',les.sub));
    b.append(el('span','num',String(j+1)),t,el('span','st',d?'Hecha':'Empezar'));
    b.onclick=()=>startLesson(n);ls.append(b);
  });
  main.append(back,k,el('h1','h-big',g.name),el('p','lead',g.sub+'.'),ls);
}
function showMenu(){const gi=GROUPS.findIndex(g=>g.ids.includes(L));showGroup(gi<0?0:gi)}
function owlMini(){const s=owl.cloneNode(true);s.removeAttribute('id');s.style.width='30px';s.style.height='30px';return s}

function startLesson(n){L=n;I=0;wrong=[];$('#top').hidden=false;$('#foot').hidden=false;renderStep()}

/* ---------- Motor ---------- */
function renderStep(){
  const steps=LESSONS[L].steps,s=steps[I];
  main.className='fade';void main.offsetWidth;main.replaceChildren();
  fb.hidden=true;fb.className='';owl.setAttribute('class','owl');go.className='';phase='idle';
  $('#fill').style.width=(I/(steps.length-1)*100)+'%';
  $('#count').textContent=(Math.min(I+1,steps.length-1))+'/'+(steps.length-1);
  if(s.t==='intro')main.classList.add('center');
  cur=R[s.t](s)||null;
  go.textContent=s.t==='summary'?'Volver al bloque':s.t==='reflect'?'Revelar':(cur?'Comprobar':'Continuar');
  update();window.scrollTo(0,0);
}
function update(){go.disabled=!!(cur&&phase==='idle'&&!cur.ready())}
go.onclick=()=>{
  const steps=LESSONS[L].steps,s=steps[I];
  if(s.t==='reflect'&&phase==='idle'){revealFn();phase='shown';go.textContent='Continuar';return}
  if(cur&&phase==='idle'){
    const ok=cur.check();phase='checked';main.classList.add('locked');
    fb.hidden=false;fb.className=ok?'ok':'ko';$('#fbt').textContent=ok?'Correcto.':'No del todo.';$('#fbx').textContent=s.exp;
    owl.setAttribute('class','owl '+(ok?'happy':'sad'));
    if(!ok)wrong.push({q:s.quote?s.q+' '+s.quote:(s.q||s.pre+' ___'),sol:s.sol});
    go.className=ok?'ok':'ko';go.textContent=steps[I+1]&&steps[I+1].t==='summary'?'Terminar':'Continuar';go.disabled=false;
    fb.scrollIntoView({block:'nearest'});
    return;
  }
  if(s.t==='summary'){showMenu();return}
  I++;renderStep();
};
$('#close').onclick=showMenu;

function head(s){main.append(el('h2','q',s.q));if(s.hint)main.append(el('p','hint',s.hint));if(s.quote)main.append(el('p','quote',s.quote))}

/* Selección única genérica */
function single(buttons,correct,onSel){
  let sel=null;
  buttons.forEach((b,i)=>{b.classList.add('interactive');b.onclick=()=>{buttons.forEach(x=>x.classList.remove('is-sel'));b.classList.add('is-sel');sel=i;update();onSel&&onSel(i)}});
  return{ready:()=>sel!==null,check(){buttons.forEach(b=>b.classList.remove('is-sel'));buttons[correct].classList.add('is-ok');if(sel!==correct)buttons[sel].classList.add('is-ko');return sel===correct}};
}

function chatBox(s,pickable){
  const box=el('div','chat'),h=el('div','chat-h'),st=el('div','stack');
  s.members.forEach(k=>st.append(av(k,'xs')));
  const t=el('div');t.append(el('b','',s.title),el('small','',s.members.map(k=>CH[k].n).join(', ')));
  h.append(st,t);box.append(h);
  const body=el('div','chat-b'),picks=[];
  s.msgs.forEach((m,idx)=>{
    const row=el('div','msg');row.append(av(m.who,'sm'));
    const can=pickable&&m.pick!==false;
    const b=can?btn('bubble pick'):el('div','bubble');whoColor(b,m.who);
    b.append(el('span','who',CH[m.who].n),el('span','txt',m.text));
    if(can){b.dataset.idx=idx;picks.push(b)}
    row.append(b);body.append(row);
  });
  box.append(body);return{box,picks};
}

const R={
  intro(s){
    const k=el('p','kicker');k.append(el('span','',groupOf(L)));
    const c=el('div','cast');
    s.cast.forEach(key=>{const f=el('figure');whoColor(f,key);f.append(av(key,'lg'),el('figcaption','',CH[key].n));c.append(f)});
    main.append(k,el('h1','h-big',s.title),el('p','lead',s.text),c);
  },
  chat(s){
    main.append(chatBox(s,false).box);
    if(s.note){const n=el('p','note');n.append(owlMini(),el('span','',s.note));main.append(n)}
  },
  theory(s){
    main.append(el('h2','',s.title),el('p','lead',s.text));
    const ul=el('ul','terms');
    (s.items||[]).forEach((it,i)=>{const li=el('li');li.append(el('span','n',s.ordered?String(i+1):'›'));const d=el('div');const b=el('b');b.append(el('mark','',it.k));d.append(b,el('span','',it.v));li.append(d);ul.append(li)});
    if(s.items)main.append(ul);if(s.foot)main.append(el('p','small',s.foot));
  },
  fill(s){
    const h=el('h2','q');h.append(s.pre+' ');const gap=el('span','gap',' ');h.append(gap,' '+s.post);main.append(h);
    const box=el('div','opts');const bs=s.opts.map(o=>{const b=btn('opt',o);box.append(b);return b});main.append(box);
    const api=single(bs,s.correct,i=>{gap.textContent=s.opts[i];gap.classList.add('filled')});
    const chk=api.check;api.check=()=>{const ok=chk();gap.textContent=s.opts[s.correct];gap.classList.add(ok?'ok':'ko');return ok};
    return api;
  },
  reflect(s){
    main.append(el('h2','q',s.q));if(s.hint)main.append(el('p','hint',s.hint));
    const box=el('div','reveal');const ph=el('span','ph','?');box.append(ph);main.append(box);
    revealFn=()=>{box.replaceChildren(el('p','',s.reveal));box.classList.add('open')};
  },
  versus(s){
    head(s);const wrap=el('div','vs');
    const mk=o=>{const b=btn('opt');whoColor(b,o.who);const d=el('div');d.append(el('span','who',CH[o.who].n),el('span','',o.text));b.append(av(o.who),d);return b};
    const a=mk(s.a),b=mk(s.b);wrap.append(a,el('span','vs-badge','vs'),b);main.append(wrap);
    return single([a,b],s.correct==='a'?0:1);
  },
  mcq(s){
    head(s);const box=el('div','opts'+(s.row?' two':''));const bs=s.opts.map(o=>{const b=btn('opt',o);box.append(b);return b});main.append(box);
    return single(bs,s.correct);
  },
  multi(s){
    head(s);main.append(el('p','hint','Puede haber más de una.'));
    const box=el('div','opts multi'),sel=new Set();
    const bs=s.opts.map((o,i)=>{const b=btn('opt interactive');const bx=el('span','box');b.append(bx,el('span','',o));
      b.setAttribute('aria-pressed','false');
      b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);const on=sel.has(i);b.classList.toggle('is-sel',on);bx.textContent=on?'✓':'';b.setAttribute('aria-pressed',on);update()};box.append(b);return b});
    main.append(box);
    return{ready:()=>sel.size>0,check(){let ok=true;bs.forEach((b,i)=>{const want=s.correct.includes(i),got=sel.has(i);b.classList.remove('is-sel');if(want)b.classList.add('is-ok');if(got&&!want){b.classList.add('is-ko');ok=false}if(want&&!got)ok=false});return ok}};
  },
  tap(s){
    head(s);const p=el('p','passage'),bs=[],idx=[];
    s.parts.forEach((pt,i)=>{if(pt.f){p.append(el('span','fixed',pt.x));return}const b=btn('seg',pt.x);p.append(b);bs.push(b);idx.push(i)});
    main.append(p);
    const api=single(bs,idx.indexOf(s.correct));return api;
  },
  chatPick(s){
    head(s);const {box,picks}=chatBox(s,true);main.append(box);
    const corr=picks.findIndex(b=>+b.dataset.idx===s.correct);
    return single(picks,corr);
  },
  cards(s){
    head(s);const ans=new Array(s.items.length).fill(null);let k=0;
    const area=el('div');main.append(area);
    function draw(){
      area.replaceChildren();
      if(k<s.items.length){
        const deck=el('div','deck'),dots=el('div','dots');
        s.items.forEach((_,i)=>{const d=el('i');if(i===k)d.className='on';else if(ans[i]!==null)d.className='done';dots.append(d)});
        const ct=el('div','ct');ct.append(el('p','',s.items[k].x));if(s.items[k].sub)ct.append(el('small','',s.items[k].sub));
        deck.append(dots,ct);
        const two=el('div','two');
        s.labels.forEach((lab,li)=>{const b=btn('opt interactive',lab);b.onclick=()=>{ans[k]=li;k++;draw();update()};two.append(b)});
        const wrap=el('div','opts');wrap.append(deck,two);
        if(k>0){const back=btn('opt interactive','Atrás');back.style.alignSelf='flex-start';back.onclick=()=>{k--;draw();update()};wrap.append(back)}
        area.append(wrap);
      }else{
        const rv=el('div','review');
        s.items.forEach((it,i)=>{const r=el('div','rrow');r.dataset.i=i;const lab=el('span','lab',s.labels[ans[i]]);r.append(lab,el('span','',it.x));rv.append(r)});
        const redo=btn('opt interactive','Cambiar respuestas');redo.style.alignSelf='flex-start';redo.onclick=()=>{k=0;draw();update()};
        const w=el('div','opts');w.append(rv,redo);area.append(w);
      }
    }
    draw();
    return{ready:()=>k>=s.items.length,check(){let ok=true;area.querySelectorAll('.rrow').forEach(r=>{const i=+r.dataset.i,good=ans[i]===s.items[i].a;r.classList.add(good?'is-ok':'is-ko');if(!good){ok=false;r.firstChild.append(el('span','fix','Era: '+s.labels[s.items[i].a]))}});area.querySelector('.opts>button').hidden=true;return ok}};
  },
  scale(s){
    head(s);const box=el('div','scale');
    const bs=[1,2,3,4,5].map(n=>{const b=btn('opt',String(n));b.style.height=(52+n*14)+'px';b.style.background='color-mix(in srgb, var(--mark) '+(n*18)+'%, var(--surface))';box.append(b);return b});
    const lab=el('div','scale-l');lab.append(el('span','','Nada'),el('span','','Totalmente'));
    main.append(box,lab);
    let sel=null;
    bs.forEach((b,i)=>{b.classList.add('interactive');b.onclick=()=>{bs.forEach(x=>x.classList.remove('is-sel'));b.classList.add('is-sel');sel=i+1;update()}});
    return{ready:()=>sel!==null,check(){bs.forEach(b=>b.classList.remove('is-sel'));s.ok.forEach(n=>bs[n-1].classList.add('is-ok'));const ok=s.ok.includes(sel);if(!ok)bs[sel-1].classList.add('is-ko');return ok}};
  },
  match(s){
    head(s);const grid=el('div','match'),lc=el('div','col'),rc=el('div','col');
    lc.append(el('p','col-h','Argumento'));rc.append(el('p','col-h','Diagnóstico'));
    const pair=new Array(s.left.length).fill(null);let act=null;
    const lb=s.left.map((t,i)=>{const b=btn('opt interactive',t);b.onclick=()=>{if(pair[i]!==null){pair[i]=null;act=null}else act=i;paint();update()};lc.append(b);return b});
    const rb=s.right.map((t,j)=>{const b=btn('opt interactive',t);b.onclick=()=>{if(act===null)return;for(let i=0;i<pair.length;i++)if(pair[i]===j)pair[i]=null;pair[act]=j;act=null;paint();update()};rc.append(b);return b});
    function paint(){
      [...lb,...rb].forEach(b=>{b.classList.remove('is-sel');const t=b.querySelector('.tag');if(t)t.remove()});
      if(act!==null)lb[act].classList.add('is-sel');
      pair.forEach((j,i)=>{if(j===null)return;lb[i].append(el('span','tag',String(i+1)));rb[j].append(el('span','tag',String(i+1)))});
    }
    grid.append(lc,rc);main.append(grid);
    return{ready:()=>pair.every(p=>p!==null),check(){let ok=true;pair.forEach((j,i)=>{const g=j===s.pairs[i];lb[i].classList.add(g?'is-ok':'is-ko');if(!g)ok=false});return ok}};
  },
  build(s){
    head(s);
    const slotsEl=el('div','slots'),pool=el('div','pool');
    const fill=new Array(s.slots.length).fill(null);
    const drops=s.slots.map((r,i)=>{const row=el('div','slot'+(r==='c'?' concl':''));row.append(el('span','lab',s.labels?s.labels[i]:(r==='c'?'Conclusión':'Premisa')));const d=el('div','drop');row.append(d);slotsEl.append(row);return d});
    const chips=s.chips.map((c,ci)=>{const b=btn('opt interactive',c.x);b.onclick=()=>{
      const at=fill.indexOf(ci);
      if(at>=0){fill[at]=null}else{const e=fill.indexOf(null);if(e<0)return;fill[e]=ci}
      paint();update()};return b});
    function paint(){
      drops.forEach((d,i)=>{d.replaceChildren();if(fill[i]!==null)d.append(chips[fill[i]])});
      pool.replaceChildren();chips.forEach((b,ci)=>{if(!fill.includes(ci))pool.append(b)});
    }
    paint();main.append(slotsEl,el('p','col-h','Fichas'),pool);
    return{ready:()=>fill.every(f=>f!==null),check(){let ok=true;fill.forEach((ci,i)=>{const want=s.slots[i],g=s.chips[ci].r===want;chips[ci].classList.add(g?'is-ok':'is-ko');if(!g)ok=false});return ok}};
  },
  summary(s){
    $('#fill').style.width='100%';$('#count').textContent='';
    const done=store.get(DONE_KEY)||{};done[LESSONS[L].title]=true;store.set(DONE_KEY,done);
    owl.setAttribute('class','owl happy');
    const k=el('p','kicker');k.append(el('span','','Lección completada'));
    main.append(k,el('h2','','Lo que te llevas'),el('p','lead',s.lead));
    const rule=el('div','rule');rule.append(el('p','kicker','La regla'),el('p','',s.rule));main.append(rule);
    const rev=el('div','rev');rev.append(el('p','kicker','Para repasar'));
    if(!wrong.length)rev.append(el('p','','No has fallado ninguna. Vuelve a hacerla dentro de unos días para comprobar que se te ha quedado.'));
    wrong.forEach(w=>{const d=el('div');d.append(el('p','',w.q),el('p','sol','Solución: '+w.sol));rev.append(d)});
    main.append(rev,el('p','small',s.biblio));
  }
};

showHome();
</script>
