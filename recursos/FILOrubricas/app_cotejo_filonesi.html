<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiloNesi · Listas de cotejo — 1.º Bachillerato Filosofía</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f7f6f2;--bg3:#f0efe9;
  --txt:#1a1a1a;--txt2:#555550;--txt3:#888880;
  --brd:#e0dfd8;--brd2:#c8c7bf;
  --indigo:#2B3A6B;--indigo-light:#eef0f7;
  --green-bg:#eaf3de;--green-txt:#27500a;
  --amber-bg:#faeeda;--amber-txt:#633806;
  --red-bg:#fcebeb;--red-txt:#791f1f;
  --teal-bg:#e1f5ee;--teal-txt:#085041;
  --blue-bg:#e6f1fb;--blue-txt:#0c447c;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
  --txt:#f0efea;--txt2:#aeada8;--txt3:#6e6e72;
  --brd:#3a3a3c;--brd2:#48484a;
  --indigo-light:#1e2235;
  --green-bg:#173404;--green-txt:#c0dd97;
  --amber-bg:#412402;--amber-txt:#fac775;
  --red-bg:#501313;--red-txt:#f09595;
  --teal-bg:#04342c;--teal-txt:#9fe1cb;
  --blue-bg:#042c53;--blue-txt:#85b7eb;
}}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:230px;flex-shrink:0;border-right:1px solid var(--brd);display:flex;flex-direction:column;background:var(--bg2);overflow:hidden}
.sidebar-header{padding:16px 14px 10px;border-bottom:1px solid var(--brd)}
.brand{font-size:13px;font-weight:700;color:var(--indigo);letter-spacing:.02em}
.brand-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.nav-wrap{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{display:flex;align-items:center;gap:6px;padding:7px 14px;border:none;background:none;cursor:pointer;width:100%;text-align:left;position:relative;transition:background .12s}
.nav-item:hover{background:var(--bg3)}
.nav-item.active{background:var(--bg);border-right:2px solid var(--indigo)}
.nav-label{font-size:12px;color:var(--txt);line-height:1.35;flex:1}
.nav-item.active .nav-label{font-weight:600;color:var(--indigo)}
.nav-nota{font-size:12px;font-weight:700;min-width:30px;text-align:right}
.nav-sep{height:1px;background:var(--brd);margin:4px 14px}

/* MAIN */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0;background:var(--bg)}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--brd);gap:10px;flex-shrink:0}
.topbar-left{flex:1;min-width:0}
.topbar-title{font-size:15px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-meta{font-size:11px;color:var(--txt3);margin-top:2px}
.topbar-right{display:flex;gap:8px;flex-shrink:0}
.btn{font-size:12px;font-weight:500;color:var(--txt2);background:var(--bg2);border:1px solid var(--brd2);border-radius:var(--radius);cursor:pointer;padding:5px 12px;transition:background .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--bg3);color:var(--txt)}
.btn-primary{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-primary:hover{background:#1e2b52;color:#fff}

/* SCORE PANEL */
.score-panel{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--brd);background:var(--bg2);flex-shrink:0}
.nota-block{text-align:center;min-width:56px}
.nota-num{font-size:32px;font-weight:700;line-height:1;transition:color .2s}
.nota-den{font-size:12px;color:var(--txt3)}
.nota-lbl{font-size:10px;color:var(--txt3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.bars-block{flex:1;display:flex;flex-direction:column;gap:5px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-lbl{font-size:11px;color:var(--txt3);min-width:80px}
.bar-track{flex:1;height:5px;background:var(--brd);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bf-clave{background:var(--indigo)}
.bf-val{background:#3B6D11}
.bf-err{background:#A32D2D}
.bar-pct{font-size:11px;color:var(--txt3);min-width:32px;text-align:right}

/* LEGEND */
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:7px 20px;border-bottom:1px solid var(--brd);background:var(--bg2);flex-shrink:0}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--txt3)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;white-space:nowrap}
.t-imp{background:var(--amber-bg);color:var(--amber-txt)}
.t-comp{background:var(--teal-bg);color:var(--teal-txt)}
.t-err{background:var(--red-bg);color:var(--red-txt)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px 20px 24px}

.block{margin-bottom:10px;border:1px solid var(--brd);border-radius:var(--radius-lg);overflow:hidden}
.block-head{padding:8px 12px;background:var(--bg2);display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--brd)}
.block-name{font-size:12px;font-weight:600;color:var(--txt);flex:1}
.block-score{font-size:11px;color:var(--txt3);white-space:nowrap}
.nivel{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;margin-left:5px}
.n1{background:#FFF3CD;color:#7A4F00}
.n2{background:#D4EDDA;color:#145523}
.n3{background:#D1ECF1;color:#0C5460}
.pts-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--blue-bg);color:var(--blue-txt);margin-left:5px}

.row{display:flex;align-items:flex-start;gap:10px;padding:7px 12px;cursor:pointer;border:none;background:none;width:100%;text-align:left;border-top:1px solid var(--brd);transition:background .1s}
.row:first-of-type{border-top:none}
.row:hover{background:var(--bg2)}
.row.ok{background:#edf7ed}
.row.bad{background:#fdf1f1}
.row.err-hint{background:#fef8f8}
@media(prefers-color-scheme:dark){
  .row.ok{background:#1a2e1a}
  .row.bad{background:#2e1a1a}
  .row.err-hint{background:#251515}
}
.cb{width:17px;height:17px;border-radius:4px;border:1.5px solid var(--brd2);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:11px;font-weight:700;transition:background .12s,border-color .12s}
.row.ok .cb{background:#3B6D11;border-color:#3B6D11;color:#fff}
.row.bad .cb{background:#A32D2D;border-color:#A32D2D;color:#fff}
.row-body{flex:1;font-size:13px;color:var(--txt);line-height:1.5}
.row.ok .row-body,.row.bad .row-body{color:var(--txt2)}

.note-box{margin-top:12px;padding:10px 14px;border-left:3px solid var(--indigo);background:var(--indigo-light)}
.note-title{font-size:10px;font-weight:700;color:var(--indigo);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.note-text{font-size:12px;color:var(--txt2);line-height:1.65;margin:0 0 5px}
.note-text:last-child{margin:0}

/* PRINT / EXPORT OVERRIDES */
@media print{
  .sidebar,.topbar-right,.legend,.score-panel{display:none!important}
  .main{overflow:visible}
  .content{overflow:visible;padding:0}
  .app{height:auto;display:block}
  .block{break-inside:avoid;margin-bottom:12px}
  .row{break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="brand">FiloNesi</div>
    <div class="brand-sub">Listas de cotejo · 1.º Bach.</div>
  </div>
  <div class="nav-wrap" id="nav"></div>
</nav>
<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="main-title">—</div>
      <div class="topbar-meta" id="main-meta"></div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="resetCurrent()">Limpiar</button>
      <button class="btn btn-primary" onclick="exportHTML()">Exportar HTML</button>
    </div>
  </div>
  <div class="score-panel">
    <div class="nota-block">
      <div class="nota-num" id="nota-num" style="color:var(--txt3)">—</div>
      <div class="nota-den">/10</div>
      <div class="nota-lbl">nota estimada</div>
    </div>
    <div class="bars-block">
      <div class="bar-row">
        <span class="bar-lbl">Clave <strong id="ct">0/0</strong></span>
        <div class="bar-track"><div class="bar-fill bf-clave" id="bc" style="width:0%"></div></div>
        <span class="bar-pct" id="bd">0%</span>
      </div>
      <div class="bar-row">
        <span class="bar-lbl">Valorable <strong id="vt">0/0</strong></span>
        <div class="bar-track"><div class="bar-fill bf-val" id="bv" style="width:0%"></div></div>
        <span class="bar-pct" id="vd">0%</span>
      </div>
      <div class="bar-row">
        <span class="bar-lbl">Errores <strong id="et">0</strong></span>
        <div class="bar-track"><div class="bar-fill bf-err" id="be" style="width:0%"></div></div>
        <span class="bar-pct" id="ed">0%</span>
      </div>
    </div>
  </div>
  <div class="legend">
    <div class="leg"><span class="tag t-imp">clave</span> peso ×3</div>
    <div class="leg"><span class="tag t-comp">contraste</span> peso ×2</div>
    <div class="leg">sin etiqueta → ×1</div>
    <div class="leg"><span class="tag t-err">error</span> penaliza −1,5 pts</div>
  </div>
  <div class="content" id="content"></div>
</div>
</div>

const QUESTS=[

   blocks:[

const W={imp:3,comp:2,val:1};
const ERR_PEN=1.5;
let cur=0;
const state={};

function sk(q,b,i){return q+'_'+b+'_'+i}
function ld(k){try{return localStorage.getItem('filo_'+k)||'0'}catch(e){return'0'}}
function sv(k,v){try{localStorage.setItem('filo_'+k,v)}catch(e){}}

function calcNota(qi){
  const q=QUESTS[qi];
  let wC=0,wCM=0,wV=0,wVM=0,nE=0,eM=0;
  q.blocks.forEach((b,bi)=>b.items.forEach((item,ii)=>{
    const v=state[sk(q.id,bi,ii)]||ld(sk(q.id,bi,ii));
    if(item.g==='err'){eM++;if(v==='2')nE++;}
    else if(item.g==='imp'||item.g==='comp'){const w=item.g==='imp'?W.imp:W.comp;wCM+=w;if(v==='1')wC+=w;}
    else{wVM+=W.val;if(v==='1')wV+=W.val;}
  }));
  const tot=wCM+wVM;
  if(tot===0)return{nota:null,pc:0,pv:0,pe:0,wC,wCM,wV,wVM,nE};
  const raw=(wC+wV)/tot;
  const pen=nE*ERR_PEN/10;
  const nota=Math.max(1,Math.min(10,Math.round((raw*9+1-pen)*10)/10));
  return{nota,pc:wCM>0?Math.round(wC/wCM*100):0,pv:wVM>0?Math.round(wV/wVM*100):0,pe:eM>0?Math.round(nE/eM*100):0,wC,wCM,wV,wVM,nE};
}

function nc(n){
  if(n===null)return'#888';
  if(n>=9)return'#3B6D11';if(n>=7)return'#185FA5';if(n>=5)return'#BA7517';return'#A32D2D';
}

function buildNav(){
  const nav=document.getElementById('nav');nav.innerHTML='';
  QUESTS.forEach((q,qi)=>{
    const btn=document.createElement('button');
    btn.className='nav-item'+(qi===cur?' active':'');
    const {nota}=calcNota(qi);
    btn.innerHTML=`<span class="nav-label">${q.short}</span><span class="nav-nota" style="color:${nc(nota)}">${nota!==null?nota.toFixed(1):'—'}</span>`;
    btn.onclick=()=>goto(qi);
    nav.appendChild(btn);
    if(qi<QUESTS.length-1){const s=document.createElement('div');s.className='nav-sep';nav.appendChild(s);}
  });
}

function goto(qi){cur=qi;buildNav();buildContent();}

function buildContent(){
  const q=QUESTS[cur];
  document.getElementById('main-title').textContent=q.title;
  document.getElementById('main-meta').textContent=q.meta;
  const content=document.getElementById('content');content.innerHTML='';
  q.blocks.forEach((blk,bi)=>{
    const div=document.createElement('div');div.className='block';
    const head=document.createElement('div');head.className='block-head';
    let hh=`<span class="block-name">${blk.h}`;
    if(blk.nivel)hh+=`<span class="nivel ${blk.nivel}">${blk.nivel==='n1'?'N1 · Preconv.':blk.nivel==='n2'?'N2 · Conv.':'N3 · Postconv.'}</span>`;
    if(blk.pts)hh+=`<span class="pts-badge">0,5 pts</span>`;
    hh+=`</span><span class="block-score" id="bs_${bi}"></span>`;
    head.innerHTML=hh;div.appendChild(head);
    blk.items.forEach((item,ii)=>{
      const k=sk(q.id,bi,ii);const v=ld(k);state[k]=v;
      const isErr=item.g==='err';
      const btn=document.createElement('button');
      btn.className='row'+(v==='1'?' ok':v==='2'?' bad':'')+(isErr&&v==='0'?' err-hint':'');
      const tagHtml=item.g==='imp'?'<span class="tag t-imp">clave</span>':item.g==='comp'?'<span class="tag t-comp">contraste</span>':item.g==='err'?'<span class="tag t-err">error</span>':'';
      btn.innerHTML=`<div class="cb">${v==='1'?'✓':v==='2'?'✗':''}</div><div class="row-body">${item.t}${tagHtml}</div>`;
      btn.onclick=()=>toggleRow(btn,k,isErr,bi,q.id);
      div.appendChild(btn);
    });
    content.appendChild(div);updateBS(bi,q.id);
  });
  if(q.note){const nb=document.createElement('div');nb.className='note-box';nb.innerHTML=`<div class="note-title">Notas de corrección</div><p class="note-text">${q.note}</p>`;content.appendChild(nb);}
  updatePanel();
}

function toggleRow(btn,k,isErr,bi,qid){
  const cv=state[k];const next=cv==='0'?(isErr?'2':'1'):'0';
  state[k]=next;sv(k,next);
  btn.className='row'+(next==='1'?' ok':next==='2'?' bad':'')+(isErr&&next==='0'?' err-hint':'');
  btn.querySelector('.cb').textContent=next==='1'?'✓':next==='2'?'✗':'';
  updateBS(bi,qid);updatePanel();buildNav();
}

function updateBS(bi,qid){
  const q=QUESTS.find(q=>q.id===qid);let ok=0,bad=0;
  q.blocks[bi].items.forEach((_,ii)=>{const v=state[sk(qid,bi,ii)]||'0';if(v==='1')ok++;if(v==='2')bad++;});
  const el=document.getElementById('bs_'+bi);if(!el)return;
  el.textContent=ok>0&&bad>0?`✓${ok} ✗${bad}`:ok>0?`✓${ok}`:bad>0?`✗${bad}`:'';
}

function updatePanel(){
  const {nota,pc,pv,pe,wC,wCM,wV,wVM,nE}=calcNota(cur);
  const nn=document.getElementById('nota-num');
  nn.textContent=nota!==null?nota.toFixed(1):'—';nn.style.color=nc(nota);
  document.getElementById('ct').textContent=`${wC}/${wCM}`;
  document.getElementById('vt').textContent=`${wV}/${wVM}`;
  document.getElementById('et').textContent=nE;
  document.getElementById('bc').style.width=pc+'%';
  document.getElementById('bv').style.width=pv+'%';
  document.getElementById('be').style.width=pe+'%';
  document.getElementById('bd').textContent=pc+'%';
  document.getElementById('vd').textContent=pv+'%';
  document.getElementById('ed').textContent=pe>0?'-'+pe+'%':'0%';
}

function resetCurrent(){
  const q=QUESTS[cur];
  q.blocks.forEach((b,bi)=>b.items.forEach((_,ii)=>{const k=sk(q.id,bi,ii);state[k]='0';sv(k,'0');}));
  buildContent();buildNav();
}

.cb{width:17px;height:17px;border-radius:4px;border:1.5px solid #c8c7bf;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#fff}
.cb-ok{background:#3B6D11;border-color:#3B6D11;color:#fff}
.cb-bad{background:#A32D2D;border-color:#A32D2D;color:#fff}
.row-body{flex:1;font-size:13px;color:#1a1a1a;line-height:1.5}
.row.ok .row-body,.row.bad .row-body{color:#555}
.note-box{margin-top:12px;padding:10px 14px;border-left:3px solid #2B3A6B;background:#eef0f7}
.note-title{font-size:10px;font-weight:700;color:#2B3A6B;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.note-text{font-size:12px;color:#444;line-height:1.65}
.footer{margin-top:24px;padding-top:12px;border-top:1px solid #e0dfd8;font-size:11px;color:#aaa;display:flex;justify-content:space-between}
@media print{body{padding:12px}.score-panel{break-inside:avoid}.block{break-inside:avoid}}
